[package]
name = "tempo-zone-prover-utils"
description = "Prover development and input-generation utilities for Tempo Zones"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-zone-contracts = { workspace = true, features = ["std"] }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives.workspace = true
zone-rpc.workspace = true
zone-spf.workspace = true
tempo-zone-prover.workspace = true

tempo-alloy.workspace = true
tempo-chainspec.workspace = true
tempo-primitives.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-network.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider = { workspace = true, features = ["reqwest", "ws"] }
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true

clap = { workspace = true, features = ["env"] }
const-hex.workspace = true
eyre.workspace = true
futures.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["asm-keccak", "keccak-cache-global"]

asm-keccak = ["alloy-primitives/asm-keccak"]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]
