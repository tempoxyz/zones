name: Metric Names

on:
  pull_request:
    paths:
      - "bin/**/*.rs"
      - "crates/**/*.rs"
      - "docs/metric-names.txt"
      - "scripts/metric-names.py"
      - ".github/workflows/metric-names.yml"

permissions:
  contents: read

jobs:
  inventory:
    permissions:
      contents: read
      id-token: write
    name: Metric name inventory up to date
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check metric name inventory
        run: python3 scripts/metric-names.py --check
