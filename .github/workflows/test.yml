name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  build-test-artifacts:
    name: build test artifacts
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check out Earn contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tempoxyz/earn
          ref: main
          path: earn
          ssh-key: ${{ secrets.EARN_DEPLOY_KEY }}
          persist-credentials: false
          submodules: true
      - uses: tempoxyz/gh-actions/actions/setup-rust-build@98b1081dcf34361b576aca2ab3041772708582ef
        with:
          toolchain: stable
      # sccache handles compiled artifacts. Keep only Cargo registry/git inputs
      # here so a persistent runner never has to archive the full target tree.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-cargo-inputs
          cache-targets: false
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        with:
          tool: nextest@0.9.124
      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@98b1081dcf34361b576aca2ab3041772708582ef
        with:
          version: nightly

      - name: Resolve Solidity cache key
        id: solidity-key
        run: |
          {
            echo "forge-sha=$(forge --version | sed -n 's/^Commit SHA: //p')"
            echo "specs-tree=$(git rev-parse HEAD:specs/ref-impls)"
            echo "earn-sha=$(git -C earn rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Solidity artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            earn/cache
            specs/ref-impls/cache
            specs/ref-impls/out
          key: forge-${{ runner.os }}-${{ steps.solidity-key.outputs.forge-sha }}-${{ steps.solidity-key.outputs.specs-tree }}-${{ steps.solidity-key.outputs.earn-sha }}

      - name: Build Solidity artifacts
        run: |
          forge build --root specs/ref-impls --no-lint
          forge build \
            --root earn \
            --skip test \
            --skip script \
            --no-lint \
            --out "$GITHUB_WORKSPACE/specs/ref-impls/out"
          forge build \
            --root earn \
            --skip test \
            --skip script \
            --no-lint \
            --out "$GITHUB_WORKSPACE/specs/ref-impls/out" \
            vendor/bridge/auth-registry/AuthRegistry.sol \
            vendor/bridge/direct-swaps/direct-swaps/DirectSwapV2.sol \
            vendor/bridge/direct-swaps/token-handler/ReserveLedgerWrappedHandler.sol \
            vendor/bridge/tip20-controller/TIP20Controller.sol

      - name: Build and archive tests
        run: cargo nextest archive --profile ci --archive-file nextest-archive.tar.zst

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: |
            nextest-archive.tar.zst
            specs/ref-impls/out
          if-no-files-found: error
          retention-days: 1
          # The nextest archive is already zstd-compressed; recompressing it is
          # slower and does not materially reduce artifact transfer size.
          compression-level: 0

  test:
    name: test (${{ matrix.partition }}/2)
    runs-on: depot-ubuntu-latest-16
    needs: build-test-artifacts
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      # The run phase consumes prebuilt binaries and does not need Rust/Cargo.
      - name: Prepare nextest install directory
        run: mkdir -p "$HOME/.cargo/bin"

      - uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        with:
          tool: nextest@0.9.124

      - name: Download test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
          path: .

      - name: Run test shard
        run: |
          cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci \
            --partition hash:${{ matrix.partition }}/2

  test-success:
    name: test success
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - build-test-artifacts
      - test
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
