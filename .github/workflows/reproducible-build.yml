name: Reproducible Build

# Builds and hashes the byte-deterministic `tempo-zone` binary via the shared
# reusable workflow in tempoxyz/gh-actions.

permissions: {}

concurrency:
  group: reproducible-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or full SHA) to build reproducibly"
        type: string
        required: false
        default: "main"

jobs:
  build:
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-build.yml@ac946e06f5f59daeebc8d33d8e7b9c9501e2ee98 # 2026-09-28T13-48-02Z-ac946e06
    permissions:
      contents: read
      id-token: write
    with:
      binary-name: tempo-zone
      ref: ${{ inputs.ref }}
