name: Storage Layout

on:
  pull_request:
    paths:
      - "specs/ref-impls/src/tempo/ZonePortal.sol"
      - "specs/ref-impls/src/interfaces/IZone.sol"
      - "specs/ref-impls/foundry.toml"
      - "specs/ref-impls/storage-layouts/ZonePortal.json"
      - ".github/workflows/storage-layout.yml"

permissions:
  contents: read

jobs:
  zone-portal:
    name: ZonePortal layout unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@c1eeb5fcba4838f20d6920e3901272cf3a14749d

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@b61457a6d6d06485b118a3c0e9637c94186c8c5a
        with:
          version: nightly

      - name: Check storage layout
        working-directory: specs/ref-impls
        run: |
          forge inspect ZonePortal storage-layout --json \
            | jq . > storage-layouts/ZonePortal.json
          git diff --exit-code -- storage-layouts/ZonePortal.json
