name: Storage Layout

on:
  pull_request:
    paths:
      - "specs/ref-impls/src/**/*.sol"
      - "specs/ref-impls/src/tempo/ZonePortal.sol"
      - "specs/ref-impls/src/interfaces/IZone.sol"
      - "specs/ref-impls/foundry.toml"
      - "specs/ref-impls/storage-layouts/ZonePortal.json"
      - ".github/workflows/storage-layout.yml"

permissions:
  contents: read

jobs:
  zone-portal:
    name: ZonePortal layout unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@98b1081dcf34361b576aca2ab3041772708582ef
        with:
          version: nightly

      - name: Check storage layout
        working-directory: specs/ref-impls
        run: |
          normalize_layout() {
            # Foundry's storage-layout JSON contains compiler-generated AST and
            # type-reference IDs. They are not part of the deployed layout and
            # can change when an imported interface changes.
            jq -S '
              def normalize_type_refs:
                gsub(
                  "t_(?<kind>struct|enum)\\((?<name>[^)]*)\\)[0-9]+";
                  "t_\(.kind)(\(.name))"
                );
              def assert_no_type_collisions:
                . as $layout
                | ($layout.types | keys | map(normalize_type_refs)) as $keys
                | if ($keys | unique | length) == ($keys | length)
                  then $layout
                  else error("storage-layout normalization collapsed type definitions")
                  end;
              assert_no_type_collisions
              | walk(
                  if type == "object" then
                    del(.astId)
                    | with_entries(
                        .key |= normalize_type_refs
                        | if (.value | type) == "string"
                          then .value |= normalize_type_refs
                          else .
                          end
                      )
                  else .
                  end
                )
            '
          }

          forge inspect ZonePortal storage-layout --json \
            | normalize_layout > /tmp/ZonePortal.generated.json
          normalize_layout < storage-layouts/ZonePortal.json \
            > /tmp/ZonePortal.expected.json
          diff --unified=0 \
            /tmp/ZonePortal.expected.json /tmp/ZonePortal.generated.json
