name: Storage Layout

on:
  pull_request:
    paths:
      - "specs/ref-impls/src/tempo/ZonePortal.sol"
      - "specs/ref-impls/src/interfaces/IZone.sol"
      - "specs/ref-impls/foundry.toml"
      - "specs/ref-impls/storage-layouts/ZonePortal.json"
      - ".github/workflows/storage-layout.yml"

permissions:
  contents: read

jobs:
  zone-portal:
    name: ZonePortal layout unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@98b1081dcf34361b576aca2ab3041772708582ef
        with:
          version: nightly

      - name: Check storage layout
        working-directory: specs/ref-impls
        run: |
          set -o pipefail

          normalize_layout() {
            jq '
              walk(
                if type == "object" then del(.astId)
                elif type == "string" and startswith("t_") then gsub("\\)([0-9]+)"; ")")
                else .
                end
              )
            '
          }

          forge inspect ZonePortal storage-layout --json \
            | normalize_layout > "$RUNNER_TEMP/ZonePortal.json"
          normalize_layout < storage-layouts/ZonePortal.json \
            | diff --unified=0 - "$RUNNER_TEMP/ZonePortal.json"
