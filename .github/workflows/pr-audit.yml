name: Pull request audit

on:
  pull_request:
    types: [labeled]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  merge_group:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Label-triggered audit -> read-only shared reusable
  audit:
    if: >-
      github.repository == 'tempoxyz/zones' &&
      (
        (
        github.event_name == 'pull_request' &&
        (
          github.event.label.name == 'cyclops' ||
          github.event.label.name == 'agentic-audit'
        )
        ) ||
        (
          github.event_name == 'pull_request_target' ||
          github.event_name == 'pull_request_review' ||
          github.event_name == 'merge_group'
        )
      )
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      statuses: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@b35994a23aaf6acf4d5e2f91d18235a6e2f90e95 # 2026-09-23T08-07-21Z-b35994a2
    with:
      required-labels: |
        cyclops
        agentic-audit
      require-completed-audit: true
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}

  # Comment-command audit -> caller-owned privileged job using the composite
  audit-comment:
    if: >-
      github.repository == 'tempoxyz/zones' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'cyclops audit') ||
        startsWith(github.event.comment.body, 'cyclops private audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops private audit') ||
        startsWith(github.event.comment.body, 'derek audit')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@b35994a23aaf6acf4d5e2f91d18235a6e2f90e95 # 2026-09-23T08-07-21Z-b35994a2

      - uses: tempoxyz/gh-actions/actions/pr-audit-comment@b35994a23aaf6acf4d5e2f91d18235a6e2f90e95 # 2026-09-23T08-07-21Z-b35994a2
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+(?:private\s+)?audit|derek\s+audit)\b'
          permission-check-mode: association
          organization: tempoxyz
          events-key: ${{ secrets.EVENTS_KEY }}
          events-cert: ${{ secrets.EVENTS_CERT }}
          events-args: ${{ secrets.EVENTS_ARGS }}
          github-token: ${{ github.token }}
