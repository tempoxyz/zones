name: Pull request audit

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  audit:
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@e8cf360f266e64f6fb3fe6975cadbad95a2c94b5 # main
    with:
      required-label: cyclops
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
