name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      reproducible_verify:
        description: "Verify a non-production reproducible candidate image"
        type: boolean
        default: false
      reproducible_eif_verify:
        description: "Verify prover EIF PCR0/PCR1/PCR2 with independent builds"
        type: boolean
        default: false
      tempo_genesis_sha256:
        description: "Required for EIF verification: expected SHA-256 of tempo_genesis_url"
        type: string
        default: ""
      ref:
        description: "Optional branch, tag, or SHA to verify (defaults to this workflow's commit)"
        type: string
        required: false
        default: ""
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        type: string
        default: ""
  workflow_call:
    inputs:
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        required: false
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tempoxyz
  TEMPO_DEVNET_GENESIS_URL: ${{ inputs.tempo_genesis_url || 'https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json' }}

jobs:
  validate-verification-dispatch:
    name: Validate verification dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.reproducible_verify == true || inputs.reproducible_eif_verify == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
      - name: Require trusted verification dispatch
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          BINARY_VERIFY: ${{ inputs.reproducible_verify }}
          EIF_VERIFY: ${{ inputs.reproducible_eif_verify }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == tempoxyz/zones && "$WORKFLOW_REF" == refs/heads/main ]] || {
            echo "Reproducibility verification must be dispatched from tempoxyz/zones main" >&2
            exit 1
          }
          [[ "$BINARY_VERIFY" != true || "$EIF_VERIFY" != true ]] || {
            echo "Select only one reproducibility verification mode" >&2
            exit 1
          }

  reproducible-verify:
    name: Verify reproducible candidate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reproducible_verify == true && inputs.reproducible_eif_verify != true &&
      github.repository == 'tempoxyz/zones' &&
      github.ref == 'refs/heads/main'
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-image-verify.yml@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ inputs.ref || github.sha }}
      build-definitions-sha: ${{ github.workflow_sha }}
      build-definition-paths: |
        .dockerignore
        docker/Dockerfile.reproducible
        docker/docker-bake.hcl
        scripts/reproducible-build.sh
      depot-project: 0c6tg19qsp
      candidate-repository: ghcr.io/tempoxyz/tempo-zone-repro
      bake-file: docker/docker-bake.hcl
      bake-target: tempo-zone-reproducible
      binary-path: /usr/local/bin/tempo-zone
      build-script: scripts/reproducible-build.sh
      rebuild-output: out/tempo-zone

  eif-toolchain:
    name: Resolve trusted EIF toolchain
    if: >-
      github.repository == 'tempoxyz/zones' &&
      ((github.event_name == 'workflow_dispatch' && inputs.reproducible_eif_verify == true &&
      inputs.reproducible_verify != true && github.ref == 'refs/heads/main') ||
      (github.event_name != 'workflow_dispatch' ||
      (inputs.reproducible_verify != true && inputs.reproducible_eif_verify != true)))
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.toolchain.outputs.image }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/zones
          ref: main
          persist-credentials: false

      - name: Validate verification inputs
        if: inputs.reproducible_eif_verify == true
        env:
          GENESIS_SHA256: ${{ inputs.tempo_genesis_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GENESIS_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "EIF verification requires tempo_genesis_sha256 (64 lowercase hex characters)" >&2
            exit 1
          }

      - name: Set up Depot
        uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Log in to toolchain registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve or publish immutable toolchain
        id: toolchain
        env:
          TOOLCHAIN_REPOSITORY: ghcr.io/tempoxyz/tempo-zone-eif-toolchain
        run: |
          set -euo pipefail
          # Hash only the toolchain Dockerfile and resolved Bake dependency graph.
          # Unrelated build targets cannot create duplicate toolchain tags.
          docker buildx bake -f docker/docker-bake.hcl --print \
            tempo-zone-prover-eif-builder | jq -cS . > "$RUNNER_TEMP/eif-toolchain-recipe.json"
          recipe_sha=$(cat docker/Dockerfile.prover-eif-builder \
            "$RUNNER_TEMP/eif-toolchain-recipe.json" | sha256sum | cut -d' ' -f1)
          image_ref="$TOOLCHAIN_REPOSITORY:inputs-$recipe_sha"
          digest=$(docker buildx imagetools inspect "$image_ref" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            metadata="$RUNNER_TEMP/eif-toolchain.json"
            depot bake --project 0c6tg19qsp --push \
              -f docker/docker-bake.hcl --metadata-file "$metadata" \
              --set "tempo-zone-prover-eif-builder.tags=$image_ref" \
              tempo-zone-prover-eif-builder
            digest="$(jq -er '.["tempo-zone-prover-eif-builder"]["containerimage.digest"]' "$metadata")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          echo "image=$TOOLCHAIN_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "EIF toolchain: \`$TOOLCHAIN_REPOSITORY@$digest\` (main recipe $(git rev-parse HEAD), inputs-$recipe_sha)" >> "$GITHUB_STEP_SUMMARY"

  reproducible-eif-verify:
    name: Verify reproducible prover EIF
    needs: eif-toolchain
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.reproducible_eif_verify == true &&
      inputs.reproducible_verify != true && github.repository == 'tempoxyz/zones' &&
      github.ref == 'refs/heads/main'
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-eif-verify.yml@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      ref: ${{ inputs.ref || github.sha }}
      build-definitions-sha: ${{ github.workflow_sha }}
      build-definition-paths: |
        .dockerignore
        docker/Dockerfile.reproducible
        docker/Dockerfile.prover-package
        scripts/package-prover-eif.sh
        scripts/reproducible-eif-build.sh
      build-script: scripts/reproducible-eif-build.sh
      eif-builder-image: ${{ needs.eif-toolchain.outputs.image }}
      build-input-url: ${{ inputs.tempo_genesis_url }}
      build-input-sha256: ${{ inputs.tempo_genesis_sha256 }}
      depot-project: 0c6tg19qsp
      artifact-name: reproducible-prover-eif-verification

  build-and-push:
    name: Build and Push Docker Images
    needs: eif-toolchain
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      always() &&
      (needs.eif-toolchain.result == 'success' ||
      (github.repository != 'tempoxyz/zones' && needs.eif-toolchain.result == 'skipped')) &&
      (github.event_name != 'workflow_dispatch' ||
      (inputs.reproducible_verify != true && inputs.reproducible_eif_verify != true)) &&
      (github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push'))
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Docker metadata for tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone
            docker.io/tempoxyz/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-xtask
            docker.io/tempoxyz/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover
            docker.io/tempoxyz/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover-utils
            docker.io/tempoxyz/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to Container Registry
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Record reproducible prover inputs
        run: |
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Configure persistent intermediate layer cache
        env:
          WRITE_BUILD_CACHE: ${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          targets = ["chef", "prover-chef", "tempo-zone", "tempo-zone-xtask",
                     "tempo-zone-prover-utils", "tempo-zone-prover-enclave",
                     "tempo-zone-prover", "tempo-zone-prover-eif-builder",
                     "tempo-zone-prover-compiled"]
          cache = {"target": {}}
          for target in targets:
              ref = f"{os.environ['REGISTRY']}/tempo-zone-buildcache:{target}"
              entry = {"cache-from": [f"type=registry,ref={ref}"]}
              if os.environ["WRITE_BUILD_CACHE"] == "true":
                  entry["cache-to"] = [f"type=registry,ref={ref},mode=max"]
              cache["target"][target] = entry
          with open(os.path.join(os.environ["RUNNER_TEMP"], "zones-buildcache.json"), "w") as f:
              json.dump(cache, f)
          PYTHON

      - name: Resolve cached EIF builder
        id: eif_builder
        env:
          PINNED_BUILDER_IMAGE: ${{ needs.eif-toolchain.outputs.image }}
          REFRESH_BUILDER: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          if [[ -n "$PINNED_BUILDER_IMAGE" ]]; then
            echo "image=$PINNED_BUILDER_IMAGE" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include the pinned kernel source and CLI recipe in the cache identity.
          key=$(cat docker/Dockerfile.prover-eif-builder docker/docker-bake.hcl | sha256sum | cut -d' ' -f1)
          ref="$REGISTRY/tempo-zone-prover-eif-builder:inputs-$key"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$REFRESH_BUILDER" != 'true' ]] && docker pull --platform linux/amd64 "$ref"; then
            # Use the resolved immutable digest throughout this run.
            image=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=tempo-zone-prover-eif-builder:local" >> "$GITHUB_OUTPUT"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile all binaries and publish images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-xtask.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-prover-utils.outputs.bake-file }}
          targets: |
            default
            tempo-zone-prover-compiled
          project: 0c6tg19qsp
          # Export only the executable for the later genesis packaging step.
          set: |
            tempo-zone-prover-compiled.target=prover-artifacts
            tempo-zone-prover-compiled.output=type=local,dest=target/prover-compiled
            tempo-zone.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
            tempo-zone-xtask.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
            tempo-zone-prover-utils.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
          # Scheduled builds refresh moving external tools and base images. All
          # commit/tag/manual builds can safely reuse Depot's content-addressed
          # layer cache and will still invalidate layers when inputs change.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}

      - name: Mark compilation complete
        id: compiled
        run: |
          binary_sha=$(sha256sum target/prover-compiled/tempo-zone-prover-enclave | cut -d' ' -f1)
          echo "binary_sha=$binary_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_sha256 "$binary_sha" \
            '{sha: $sha, attempt: $attempt, binary_sha256: $binary_sha256}' > "$RUNNER_TEMP/compilation.json"

      - name: Upload compilation marker
        if: inputs.defer_genesis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prover-compiled-${{ steps.shortsha.outputs.shortsha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compilation.json
          if-no-files-found: error

      - name: Download Tempo devnet genesis
        shell: bash
        env:
          DEFER_GENESIS: ${{ inputs.defer_genesis }}
        run: |
          set -euo pipefail

          mkdir -p .tempo-genesis
          # Compilation has finished; the caller can now select the fork time.
          # Bound the rendezvous so an interrupted caller cannot strand a runner.
          deadline=$((SECONDS + 180))
          until curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 --location \
            --output .tempo-genesis/genesis.json "$TEMPO_DEVNET_GENESIS_URL"; do
            if [[ "${DEFER_GENESIS}" != true ]] || (( SECONDS >= deadline )); then
              echo "Genesis download failed or timed out" >&2
              exit 1
            fi
            sleep 1
          done
          jq -e '.config.chainId | type == "number"' \
            .tempo-genesis/genesis.json >/dev/null

          genesis_sha=$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)
          echo "Embedding Tempo devnet genesis sha256:${genesis_sha}"

      - name: Build private-copy EIF toolchain
        if: steps.eif_builder.outputs.hit != 'true'
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: docker/docker-bake.hcl
          targets: tempo-zone-prover-eif-builder
          set: tempo-zone-prover-eif-builder.tags=tempo-zone-prover-eif-builder:local
          project: 0c6tg19qsp
          load: true

      - name: Build tempo-zone-prover EIF
        env:
          BUILD_BACKEND: depot
          DEPOT_PROJECT: 0c6tg19qsp
          PROVER_BINARY_DIR: target/prover-compiled
          BUILD_INPUT_FILE: .tempo-genesis/genesis.json
          EIF_BUILDER_IMAGE: ${{ steps.eif_builder.outputs.image }}
          OUT_DIR: target/tempo-zone-prover-eif
        run: |
          scripts/package-prover-eif.sh
          mv "$OUT_DIR/enclave.eif" "$OUT_DIR/tempo-zone-prover.eif"

      - name: Read tempo-zone-prover PCR measurements
        id: prover_measurements
        shell: bash
        run: |
          set -Eeuo pipefail

          measurements=target/tempo-zone-prover-eif/measurements.json
          {
            echo "hash_algorithm=$(jq -er '.Measurements.HashAlgorithm | strings | select(length > 0)' "$measurements")"
            echo "pcr0=$(jq -er '.Measurements.PCR0 | strings | select(length > 0)' "$measurements")"
            echo "pcr1=$(jq -er '.Measurements.PCR1 | strings | select(length > 0)' "$measurements")"
            echo "pcr2=$(jq -er '.Measurements.PCR2 | strings | select(length > 0)' "$measurements")"
          } >> "$GITHUB_OUTPUT"

      - name: Bind measurements to this build and genesis
        env:
          PROVER_BINARY_SHA256: ${{ steps.compiled.outputs.binary_sha }}
          EIF_BUILDER_IMAGE: ${{ steps.eif_builder.outputs.image }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg genesis_sha256 "$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)" \
            --arg binary_sha256 "$PROVER_BINARY_SHA256" \
            --arg eif_builder_image "$EIF_BUILDER_IMAGE" \
            '{sha: $sha, attempt: $attempt, genesis_sha256: $genesis_sha256, binary_sha256: $binary_sha256, eif_builder_image: $eif_builder_image}' \
            > target/tempo-zone-prover-eif/identity.json

      - name: Upload tempo-zone-prover PCR measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone-prover-measurements-${{ steps.shortsha.outputs.shortsha }}${{ inputs.defer_genesis && format('-{0}', github.run_attempt) || '' }}
          path: |
            target/tempo-zone-prover-eif/measurements.json
            target/tempo-zone-prover-eif/identity.json
          if-no-files-found: error

      - name: Build and push tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone-prover.outputs.bake-file }}
          targets: tempo-zone-prover
          set: |
            tempo-zone-prover.args.NITRO_HASH_ALGORITHM=${{ steps.prover_measurements.outputs.hash_algorithm }}
            tempo-zone-prover.args.NITRO_PCR0=${{ steps.prover_measurements.outputs.pcr0 }}
            tempo-zone-prover.args.NITRO_PCR1=${{ steps.prover_measurements.outputs.pcr1 }}
            tempo-zone-prover.args.NITRO_PCR2=${{ steps.prover_measurements.outputs.pcr2 }}
          project: 0c6tg19qsp
          push: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                github.event_name != 'pull_request' &&
                github.event_name != 'merge_group' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Publish Zones CI event
        if: >-
          github.repository == 'tempoxyz/zones' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          SHORT_SHA: ${{ steps.shortsha.outputs.shortsha }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/tempo-zone:sha-${SHORT_SHA}"
          digest=""
          for attempt in {1..12}; do
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for $image to become readable (attempt $attempt/12)"
            sleep 5
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve a valid digest for $image" >&2
            exit 1
          }

          install -m 0700 -d "$RUNNER_TEMP/events"
          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/events/key.pem"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/events/cert.pem"
          payload=$(jq -cn \
            --arg tag "sha-${SHORT_SHA}" \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg digest "$digest" \
            '{
              repository: "tempoxyz/zones",
              event: "registry_package",
              data: {
                tag: $tag,
                sha: $sha,
                branch: $branch,
                digest: $digest
              }
            }')
          command -v python3 >/dev/null || {
            echo "python3 is required to parse EVENTS_ARGS" >&2
            exit 1
          }
          mapfile -t events_args < <(
            python3 - "$EVENTS_ARGS" <<'PY'
          import shlex
          import sys

          for argument in shlex.split(sys.argv[1]):
              print(argument)
          PY
          )
          (( ${#events_args[@]} > 0 )) || {
            echo "EVENTS_ARGS is empty" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --key "$RUNNER_TEMP/events/key.pem" \
            --cert "$RUNNER_TEMP/events/cert.pem" \
            "${events_args[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload"
