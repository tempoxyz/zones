name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
  workflow_call:
    inputs:
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        required: false
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tempoxyz
  TEMPO_DEVNET_GENESIS_URL: ${{ inputs.tempo_genesis_url || 'https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json' }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push')
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Docker metadata for tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: ${{ env.REGISTRY }}/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to Container Registry
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Tempo devnet genesis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tempo-genesis
          curl --proto '=https' --tlsv1.2 \
            --fail-with-body --location \
            --output .tempo-genesis/genesis.json \
            "$TEMPO_DEVNET_GENESIS_URL"
          jq -e '.config.chainId | type == "number"' \
            .tempo-genesis/genesis.json >/dev/null

          genesis_sha=$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)
          echo "Embedding Tempo devnet genesis sha256:${genesis_sha}"

      - name: Configure persistent intermediate layer cache
        env:
          WRITE_BUILD_CACHE: ${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          WRITE_PR_BUILD_CACHE: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                github.event_name == 'pull_request' &&
                github.event.pull_request.base.ref == 'main' &&
                github.event.pull_request.head.repo.full_name == github.repository }}
          READ_PR_BUILD_CACHE: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                (github.event_name == 'pull_request' ||
                 github.event_name == 'merge_group' ||
                 github.event_name == 'workflow_dispatch') }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          targets = ["chef", "prover-chef", "tempo-zone", "tempo-zone-xtask",
                     "tempo-zone-prover-utils", "tempo-zone-prover-enclave",
                     "tempo-zone-prover", "tempo-zone-prover-eif-builder"]
          cache = {"target": {}}
          for target in targets:
              ref = f"{os.environ['REGISTRY']}/tempo-zone-buildcache:{target}"
              pr_ref = f"{ref}-pr-main"
              entry = {"cache-from": [f"type=registry,ref={ref}"]}
              # PRs warm a separate rolling cache without replacing the main cache.
              # Queue and dispatched devnet builds consume both. Concurrent PRs
              # may replace this best-effort cache; BuildKit validates input keys.
              if os.environ["READ_PR_BUILD_CACHE"] == "true":
                  entry["cache-from"].append(f"type=registry,ref={pr_ref}")
              if os.environ["WRITE_BUILD_CACHE"] == "true":
                  entry["cache-to"] = [f"type=registry,ref={ref},mode=max"]
              elif os.environ["WRITE_PR_BUILD_CACHE"] == "true":
                  entry["cache-to"] = [f"type=registry,ref={pr_ref},mode=max"]
              cache["target"][target] = entry
          with open(os.path.join(os.environ["RUNNER_TEMP"], "zones-buildcache.json"), "w") as f:
              json.dump(cache, f)
          PYTHON

      - name: Build and push Docker images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-xtask.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-prover-utils.outputs.bake-file }}
          targets: default
          project: 0c6tg19qsp
          push: ${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
          # Scheduled builds refresh moving external tools and base images. All
          # commit/tag/manual builds can safely reuse Depot's content-addressed
          # layer cache and will still invalidate layers when inputs change.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}

      - name: Resolve cached EIF builder
        id: eif_builder
        env:
          REFRESH_BUILDER: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # Include the pinned kernel source and CLI recipe in the cache identity.
          key=$(cat docker/Dockerfile.prover-eif-builder docker/docker-bake.hcl | sha256sum | cut -d' ' -f1)
          ref="$REGISTRY/tempo-zone-prover-eif-builder:inputs-$key"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$REFRESH_BUILDER" != 'true' ]] && docker pull --platform linux/amd64 "$ref"; then
            # Use the resolved immutable digest throughout this run.
            image=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=tempo-zone-prover-eif-builder:local" >> "$GITHUB_OUTPUT"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      # Nitro CLI converts images from the runner's local Docker image store.
      # Bake both independent inputs together so BuildKit can build them in parallel.
      - name: Load tempo-zone-prover EIF inputs
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
          targets: ${{ steps.eif_builder.outputs.hit == 'true' && 'tempo-zone-prover-enclave' || 'prover-eif-inputs' }}
          set: |
            tempo-zone-prover-enclave.tags=tempo-zone-prover-enclave:eif-source
            tempo-zone-prover-enclave.contexts.tempo-genesis=.tempo-genesis
            tempo-zone-prover-eif-builder.tags=tempo-zone-prover-eif-builder:local
          project: 0c6tg19qsp
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Publish EIF builder cache
        if: >-
          steps.eif_builder.outputs.hit != 'true' &&
          github.repository == 'tempoxyz/zones' &&
          github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          BUILDER_REF: ${{ steps.eif_builder.outputs.ref }}
        run: |
          set -euo pipefail
          docker tag tempo-zone-prover-eif-builder:local "$BUILDER_REF"
          docker push "$BUILDER_REF"

      - name: Build tempo-zone-prover EIF
        env:
          PROVER_IMAGE: tempo-zone-prover-enclave:eif-source
          EIF_BUILDER_IMAGE: ${{ steps.eif_builder.outputs.image }}
          EIF_OUTPUT_DIR: target/tempo-zone-prover-eif
        run: |
          set -Eeuo pipefail

          mkdir -p "$EIF_OUTPUT_DIR"

          docker run --rm \
            --platform linux/amd64 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/$EIF_OUTPUT_DIR:/output" \
            "$EIF_BUILDER_IMAGE" \
            build-enclave \
            --docker-uri "$PROVER_IMAGE" \
            --output-file /output/tempo-zone-prover.eif \
            | tee "$EIF_OUTPUT_DIR/measurements.json"

      - name: Read tempo-zone-prover PCR measurements
        id: prover_measurements
        shell: bash
        run: |
          set -Eeuo pipefail

          measurements=target/tempo-zone-prover-eif/measurements.json
          {
            echo "hash_algorithm=$(jq -er '.Measurements.HashAlgorithm | strings | select(length > 0)' "$measurements")"
            echo "pcr0=$(jq -er '.Measurements.PCR0 | strings | select(length > 0)' "$measurements")"
            echo "pcr1=$(jq -er '.Measurements.PCR1 | strings | select(length > 0)' "$measurements")"
            echo "pcr2=$(jq -er '.Measurements.PCR2 | strings | select(length > 0)' "$measurements")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone-prover.outputs.bake-file }}
          targets: tempo-zone-prover
          set: |
            tempo-zone-prover.args.NITRO_HASH_ALGORITHM=${{ steps.prover_measurements.outputs.hash_algorithm }}
            tempo-zone-prover.args.NITRO_PCR0=${{ steps.prover_measurements.outputs.pcr0 }}
            tempo-zone-prover.args.NITRO_PCR1=${{ steps.prover_measurements.outputs.pcr1 }}
            tempo-zone-prover.args.NITRO_PCR2=${{ steps.prover_measurements.outputs.pcr2 }}
          project: 0c6tg19qsp
          push: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                github.event_name != 'pull_request' &&
                github.event_name != 'merge_group' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Upload tempo-zone-prover PCR measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone-prover-measurements-${{ steps.shortsha.outputs.shortsha }}
          path: target/tempo-zone-prover-eif/measurements.json
          if-no-files-found: error

      - name: Publish Zones CI event
        if: >-
          github.repository == 'tempoxyz/zones' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          SHORT_SHA: ${{ steps.shortsha.outputs.shortsha }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/tempo-zone:sha-${SHORT_SHA}"
          digest=""
          for attempt in {1..12}; do
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for $image to become readable (attempt $attempt/12)"
            sleep 5
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve a valid digest for $image" >&2
            exit 1
          }

          install -m 0700 -d "$RUNNER_TEMP/events"
          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/events/key.pem"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/events/cert.pem"
          payload=$(jq -cn \
            --arg tag "sha-${SHORT_SHA}" \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg digest "$digest" \
            '{
              repository: "tempoxyz/zones",
              event: "registry_package",
              data: {
                tag: $tag,
                sha: $sha,
                branch: $branch,
                digest: $digest
              }
            }')
          command -v python3 >/dev/null || {
            echo "python3 is required to parse EVENTS_ARGS" >&2
            exit 1
          }
          mapfile -t events_args < <(
            python3 - "$EVENTS_ARGS" <<'PY'
          import shlex
          import sys

          for argument in shlex.split(sys.argv[1]):
              print(argument)
          PY
          )
          (( ${#events_args[@]} > 0 )) || {
            echo "EVENTS_ARGS is empty" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --key "$RUNNER_TEMP/events/key.pem" \
            --cert "$RUNNER_TEMP/events/cert.pem" \
            "${events_args[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload"
