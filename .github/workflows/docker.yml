name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      reproducible_verify:
        description: "Verify a non-production reproducible candidate image"
        type: boolean
        default: false
      reproducible_eif_verify:
        description: "Verify prover EIF PCR0/PCR1/PCR2 with independent builds"
        type: boolean
        default: false
      tempo_genesis_sha256:
        description: "Required for EIF verification: expected SHA-256 of tempo_genesis_url"
        type: string
        default: ""
      eif_builder_image:
        description: "Optional EIF toolchain image@sha256:digest; empty builds and records one"
        type: string
        default: ""
      ref:
        description: "Optional branch, tag, or SHA to verify (defaults to this workflow's commit)"
        type: string
        required: false
        default: ""
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
  workflow_call:
    inputs:
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        required: false
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tempoxyz
  TEMPO_DEVNET_GENESIS_URL: ${{ inputs.tempo_genesis_url || 'https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json' }}

jobs:
  reproducible-verify:
    name: Verify reproducible candidate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reproducible_verify == true &&
      github.repository == 'tempoxyz/zones' &&
      github.ref == 'refs/heads/main'
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-image-verify.yml@5e789f13f8434b76ac105b49e15f696569e23734 # main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ inputs.ref || github.sha }}
      build-definitions-sha: ${{ github.workflow_sha }}
      build-definition-paths: |
        .dockerignore
        docker/Dockerfile.reproducible
        docker/docker-bake.hcl
        scripts/reproducible-build.sh
      depot-project: 0c6tg19qsp
      candidate-repository: ghcr.io/tempoxyz/tempo-zone-repro
      bake-file: docker/docker-bake.hcl
      bake-target: tempo-zone-reproducible
      binary-path: /usr/local/bin/tempo-zone
      build-script: scripts/reproducible-build.sh
      rebuild-output: out/tempo-zone

  eif-toolchain:
    name: Pin EIF toolchain image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reproducible_eif_verify == true &&
      github.repository == 'tempoxyz/zones' &&
      github.ref == 'refs/heads/dan/reproducible-eif-smoke'
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.toolchain.outputs.image }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e8383309ef9889168bdfb1e678e9b01903b6f51f # main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate verification inputs
        env:
          GENESIS_SHA256: ${{ inputs.tempo_genesis_sha256 }}
          EIF_BUILDER_IMAGE: ${{ inputs.eif_builder_image }}
        run: |
          set -euo pipefail
          [[ "$GENESIS_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "EIF verification requires tempo_genesis_sha256 (64 lowercase hex characters)" >&2
            exit 1
          }
          if [[ -n "$EIF_BUILDER_IMAGE" ]]; then
            [[ "$EIF_BUILDER_IMAGE" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]] || {
              echo "eif_builder_image must be pinned by sha256 digest" >&2
              exit 1
            }
          fi

      - name: Set up Depot
        if: inputs.eif_builder_image == ''
        uses: tempoxyz/gh-actions/vendor/depot/setup-action@b61457a6d6d06485b118a3c0e9637c94186c8c5a # main

      - name: Log in to toolchain registry
        if: inputs.eif_builder_image == ''
        uses: tempoxyz/gh-actions/vendor/docker/login-action@b61457a6d6d06485b118a3c0e9637c94186c8c5a # main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve or publish immutable toolchain
        id: toolchain
        env:
          EIF_BUILDER_IMAGE: ${{ inputs.eif_builder_image }}
          TOOLCHAIN_REPOSITORY: ghcr.io/tempoxyz/tempo-zone-eif-toolchain
        run: |
          set -euo pipefail
          if [[ -z "$EIF_BUILDER_IMAGE" ]]; then
            metadata="$RUNNER_TEMP/eif-toolchain.json"
            depot bake --project 0c6tg19qsp --push \
              -f docker/docker-bake.hcl --metadata-file "$metadata" \
              --set "tempo-zone-prover-eif-builder.tags=$TOOLCHAIN_REPOSITORY:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              tempo-zone-prover-eif-builder
            digest="$(jq -er '.["tempo-zone-prover-eif-builder"]["containerimage.digest"]' "$metadata")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            EIF_BUILDER_IMAGE="$TOOLCHAIN_REPOSITORY@$digest"
          fi
          echo "image=$EIF_BUILDER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "EIF toolchain: \`$EIF_BUILDER_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  reproducible-eif-verify:
    name: Verify reproducible prover EIF
    needs: eif-toolchain
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-eif-verify.yml@1b0b42c4dac07119c575280ea910a538b97ff010 # main
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      ref: ${{ inputs.ref || github.sha }}
      build-definitions-sha: ${{ github.workflow_sha }}
      build-definition-paths: |
        .dockerignore
        docker/Dockerfile.reproducible
        scripts/reproducible-eif-build.sh
      build-script: scripts/reproducible-eif-build.sh
      eif-builder-image: ${{ needs.eif-toolchain.outputs.image }}
      build-input-url: ${{ inputs.tempo_genesis_url }}
      build-input-sha256: ${{ inputs.tempo_genesis_sha256 }}
      depot-project: 0c6tg19qsp
      artifact-name: reproducible-prover-eif-verification

  build-and-push:
    name: Build and Push Docker Images
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      (inputs.reproducible_verify != true && inputs.reproducible_eif_verify != true)) &&
      (github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push'))
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6a4184039b7a7537d35ace0badc96764d5a1d4d0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7

      - name: Docker metadata for tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          images: ${{ env.REGISTRY }}/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          images: ${{ env.REGISTRY }}/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to Container Registry
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Tempo devnet genesis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tempo-genesis
          curl --proto '=https' --tlsv1.2 \
            --fail-with-body --location \
            --output .tempo-genesis/genesis.json \
            "$TEMPO_DEVNET_GENESIS_URL"
          jq -e '.config.chainId | type == "number"' \
            .tempo-genesis/genesis.json >/dev/null

          genesis_sha=$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)
          echo "Embedding Tempo devnet genesis sha256:${genesis_sha}"

      - name: Build and push Docker images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          files: |
            docker/docker-bake.hcl
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-xtask.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-prover-utils.outputs.bake-file }}
          targets: default
          project: 0c6tg19qsp
          push: ${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
          # Scheduled builds refresh moving external tools and base images. All
          # commit/tag/manual builds can safely reuse Depot's content-addressed
          # layer cache and will still invalidate layers when inputs change.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}

      # Nitro CLI converts images from the runner's local Docker image store.
      # Bake both independent inputs together so BuildKit can build them in parallel.
      - name: Load tempo-zone-prover EIF inputs
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          files: docker/docker-bake.hcl
          targets: |
            tempo-zone-prover-enclave
            tempo-zone-prover-eif-builder
          set: |
            tempo-zone-prover-enclave.tags=tempo-zone-prover-enclave:eif-source
            tempo-zone-prover-enclave.contexts.tempo-genesis=.tempo-genesis
            tempo-zone-prover-eif-builder.tags=tempo-zone-prover-eif-builder:local
          project: 0c6tg19qsp
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Build tempo-zone-prover EIF
        env:
          PROVER_IMAGE: tempo-zone-prover-enclave:eif-source
          EIF_BUILDER_IMAGE: tempo-zone-prover-eif-builder:local
          EIF_OUTPUT_DIR: target/tempo-zone-prover-eif
        run: |
          set -Eeuo pipefail

          mkdir -p "$EIF_OUTPUT_DIR"

          docker run --rm \
            --platform linux/amd64 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/$EIF_OUTPUT_DIR:/output" \
            "$EIF_BUILDER_IMAGE" \
            build-enclave \
            --docker-uri "$PROVER_IMAGE" \
            --output-file /output/tempo-zone-prover.eif \
            | tee "$EIF_OUTPUT_DIR/measurements.json"

      - name: Read tempo-zone-prover PCR measurements
        id: prover_measurements
        shell: bash
        run: |
          set -Eeuo pipefail

          measurements=target/tempo-zone-prover-eif/measurements.json
          {
            echo "hash_algorithm=$(jq -er '.Measurements.HashAlgorithm | strings | select(length > 0)' "$measurements")"
            echo "pcr0=$(jq -er '.Measurements.PCR0 | strings | select(length > 0)' "$measurements")"
            echo "pcr1=$(jq -er '.Measurements.PCR1 | strings | select(length > 0)' "$measurements")"
            echo "pcr2=$(jq -er '.Measurements.PCR2 | strings | select(length > 0)' "$measurements")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          files: |
            docker/docker-bake.hcl
            ${{ steps.meta-tempo-zone-prover.outputs.bake-file }}
          targets: tempo-zone-prover
          set: |
            tempo-zone-prover.args.NITRO_HASH_ALGORITHM=${{ steps.prover_measurements.outputs.hash_algorithm }}
            tempo-zone-prover.args.NITRO_PCR0=${{ steps.prover_measurements.outputs.pcr0 }}
            tempo-zone-prover.args.NITRO_PCR1=${{ steps.prover_measurements.outputs.pcr1 }}
            tempo-zone-prover.args.NITRO_PCR2=${{ steps.prover_measurements.outputs.pcr2 }}
          project: 0c6tg19qsp
          push: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                github.event_name != 'pull_request' &&
                github.event_name != 'merge_group' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Upload tempo-zone-prover PCR measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone-prover-measurements-${{ steps.shortsha.outputs.shortsha }}
          path: target/tempo-zone-prover-eif/measurements.json
          if-no-files-found: error

      - name: Publish Zones CI event
        if: >-
          github.repository == 'tempoxyz/zones' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          SHORT_SHA: ${{ steps.shortsha.outputs.shortsha }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/tempo-zone:sha-${SHORT_SHA}"
          digest=""
          for attempt in {1..12}; do
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for $image to become readable (attempt $attempt/12)"
            sleep 5
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve a valid digest for $image" >&2
            exit 1
          }

          install -m 0700 -d "$RUNNER_TEMP/events"
          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/events/key.pem"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/events/cert.pem"
          payload=$(jq -cn \
            --arg tag "sha-${SHORT_SHA}" \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg digest "$digest" \
            '{
              repository: "tempoxyz/zones",
              event: "registry_package",
              data: {
                tag: $tag,
                sha: $sha,
                branch: $branch,
                digest: $digest
              }
            }')
          command -v python3 >/dev/null || {
            echo "python3 is required to parse EVENTS_ARGS" >&2
            exit 1
          }
          mapfile -t events_args < <(
            python3 - "$EVENTS_ARGS" <<'PY'
          import shlex
          import sys

          for argument in shlex.split(sys.argv[1]):
              print(argument)
          PY
          )
          (( ${#events_args[@]} > 0 )) || {
            echo "EVENTS_ARGS is empty" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --key "$RUNNER_TEMP/events/key.pem" \
            --cert "$RUNNER_TEMP/events/cert.pem" \
            "${events_args[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload"
