name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      reproducible_verify:
        description: "Verify a non-production reproducible candidate image"
        type: boolean
        default: false
      ref:
        description: "Optional branch, tag, or SHA to verify (defaults to this workflow's commit)"
        type: string
        required: false
        default: ""
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        type: string
        default: ""
  workflow_call:
    inputs:
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        required: false
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tempoxyz
  STAGING_REPOSITORY: ghcr.io/tempoxyz/tempo-zone-staging
  TEMPO_DEVNET_GENESIS_URL: ${{ inputs.tempo_genesis_url || 'https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json' }}

jobs:
  resolve-production-build-inputs:
    name: Resolve production Docker build inputs
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.reproducible_verify != true) &&
      (github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      source_date_epoch: ${{ steps.commit.outputs.source_date_epoch }}
      staging_tag: ${{ steps.commit.outputs.staging_tag }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Check out workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Record immutable build inputs
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"

          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Resolved ref is not a full commit SHA: $commit_sha" >&2
            exit 1
          }
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]] || {
            echo "Invalid SOURCE_DATE_EPOCH: $source_date_epoch" >&2
            exit 1
          }

          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "source_date_epoch=$source_date_epoch"
            echo "staging_tag=verify-${commit_sha}-${GITHUB_RUN_ID}"
            echo "version=sha-$short_sha"
          } >> "$GITHUB_OUTPUT"

  reproducible-verify:
    name: Verify reproducible candidate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reproducible_verify == true &&
      github.repository == 'tempoxyz/zones' &&
      github.ref == 'refs/heads/main'
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-image-verify.yml@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ inputs.ref || github.sha }}
      build-definitions-sha: ${{ github.workflow_sha }}
      build-definition-paths: |
        .dockerignore
        docker/Dockerfile.reproducible
        docker/docker-bake.hcl
        scripts/reproducible-build.sh
      depot-project: 0c6tg19qsp
      candidate-repository: ghcr.io/tempoxyz/tempo-zone-repro
      bake-file: docker/docker-bake.hcl
      bake-target: tempo-zone-reproducible
      binary-path: /usr/local/bin/tempo-zone
      build-script: scripts/reproducible-build.sh
      rebuild-output: out/tempo-zone

  build-and-push:
    name: Build candidate Docker images
    needs: resolve-production-build-inputs
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.reproducible_verify != true) &&
      (github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push'))
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GIT_SHA: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve-production-build-inputs.outputs.source_date_epoch }}
      VERSION: ${{ needs.resolve-production-build-inputs.outputs.version }}
    outputs:
      artifact_id: ${{ steps.images.outputs.artifact-id }}
      builder_ref: ${{ steps.eif_builder.outputs.ref }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Check out resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
          persist-credentials: false
          submodules: recursive

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Docker metadata for tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone
            docker.io/tempoxyz/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-xtask
            docker.io/tempoxyz/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover
            docker.io/tempoxyz/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover-utils
            docker.io/tempoxyz/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to Container Registry
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve cached EIF builder
        id: eif_builder
        env:
          REFRESH_BUILDER: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # Include the pinned kernel source and CLI recipe in the cache identity.
          key=$(cat docker/Dockerfile.prover-eif-builder docker/docker-bake.hcl | sha256sum | cut -d' ' -f1)
          ref="$REGISTRY/tempo-zone-prover-eif-builder:inputs-$key"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$REFRESH_BUILDER" != 'true' ]] && docker pull --platform linux/amd64 "$ref"; then
            # Use the resolved immutable digest throughout this run.
            image=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=tempo-zone-prover-eif-builder:local" >> "$GITHUB_OUTPUT"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare candidate image exports
        run: mkdir -p "$RUNNER_TEMP/candidate-images"

      - name: Compile all binaries and publish images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          provenance: false
          files: |
            docker/docker-bake.hcl
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-xtask.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-prover-utils.outputs.bake-file }}
          targets: |
            default
            tempo-zone-prover-compiled
          project: 0c6tg19qsp
          # Export only the executable for the later genesis packaging step.
          set: |
            tempo-zone-prover-compiled.target=compiled
            tempo-zone-prover-compiled.output=type=local,dest=target/prover-compiled
            tempo-zone.tags=tempo-zone:candidate
            tempo-zone.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-zone.tar
            tempo-zone-xtask.tags=tempo-zone-xtask:candidate
            tempo-zone-xtask.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-zone-xtask.tar
            tempo-zone-prover-utils.tags=tempo-zone-prover-utils:candidate
            tempo-zone-prover-utils.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-zone-prover-utils.tar
          # Private registry cache layers can retain expired BuildKit client
          # sessions across runs. Build fresh layers instead of importing them.
          no-cache: true
          pull: true
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}

      - name: Mark compilation complete
        id: compiled
        run: |
          binary_sha=$(sha256sum target/prover-compiled/tempo-zone-prover-enclave | cut -d' ' -f1)
          echo "binary_sha=$binary_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_sha256 "$binary_sha" \
            '{sha: $sha, attempt: $attempt, binary_sha256: $binary_sha256}' > "$RUNNER_TEMP/compilation.json"

      - name: Upload compilation marker
        if: inputs.defer_genesis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prover-compiled-${{ steps.shortsha.outputs.shortsha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compilation.json
          if-no-files-found: error

      - name: Download Tempo devnet genesis
        shell: bash
        env:
          DEFER_GENESIS: ${{ inputs.defer_genesis }}
        run: |
          set -euo pipefail

          mkdir -p .tempo-genesis
          # Compilation has finished; the caller can now select the fork time.
          # Bound the rendezvous so an interrupted caller cannot strand a runner.
          deadline=$((SECONDS + 180))
          until curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 --location \
            --output .tempo-genesis/genesis.json "$TEMPO_DEVNET_GENESIS_URL"; do
            if [[ "${DEFER_GENESIS}" != true ]] || (( SECONDS >= deadline )); then
              echo "Genesis download failed or timed out" >&2
              exit 1
            fi
            sleep 1
          done
          jq -e '.config.chainId | type == "number"' \
            .tempo-genesis/genesis.json >/dev/null

          genesis_sha=$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)
          echo "Embedding Tempo devnet genesis sha256:${genesis_sha}"

      # Nitro CLI converts images from the runner's local Docker image store.
      # Bake both independent inputs together so BuildKit can build them in parallel.
      - name: Load tempo-zone-prover EIF inputs
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
          targets: ${{ steps.eif_builder.outputs.hit == 'true' && 'tempo-zone-prover-enclave' || 'prover-eif-inputs' }}
          set: |
            tempo-zone-prover-enclave.tags=tempo-zone-prover-enclave:eif-source
            tempo-zone-prover-enclave.dockerfile=docker/Dockerfile.prover-package
            tempo-zone-prover-enclave.contexts.chef=.
            tempo-zone-prover-enclave.contexts.prover-binary=target/prover-compiled
            tempo-zone-prover-enclave.args.PROVER_BINARY_SHA256=${{ steps.compiled.outputs.binary_sha }}
            tempo-zone-prover-enclave.contexts.tempo-genesis=.tempo-genesis
            tempo-zone-prover-eif-builder.tags=tempo-zone-prover-eif-builder:local
          project: 0c6tg19qsp
          load: true
          # Cached Nitro layers can retain an expired registry auth session from
          # the earlier Bake call. Rebuild these packaging-only inputs locally;
          # the Rust binary was already compiled and exported above.
          no-cache: true
          pull: true

      - name: Export EIF builder cache image
        if: >-
          steps.eif_builder.outputs.hit != 'true' &&
          github.repository == 'tempoxyz/zones' &&
          github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: docker save tempo-zone-prover-eif-builder:local --output "$RUNNER_TEMP/candidate-images/eif-builder.tar"

      - name: Build tempo-zone-prover EIF
        env:
          PROVER_IMAGE: tempo-zone-prover-enclave:eif-source
          EIF_BUILDER_IMAGE: ${{ steps.eif_builder.outputs.image }}
          EIF_OUTPUT_DIR: target/tempo-zone-prover-eif
        run: |
          set -Eeuo pipefail

          mkdir -p "$EIF_OUTPUT_DIR"

          docker run --rm \
            --platform linux/amd64 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/$EIF_OUTPUT_DIR:/output" \
            "$EIF_BUILDER_IMAGE" \
            build-enclave \
            --docker-uri "$PROVER_IMAGE" \
            --output-file /output/tempo-zone-prover.eif \
            | tee "$EIF_OUTPUT_DIR/measurements.json"

      - name: Read tempo-zone-prover PCR measurements
        id: prover_measurements
        shell: bash
        run: |
          set -Eeuo pipefail

          measurements=target/tempo-zone-prover-eif/measurements.json
          {
            echo "hash_algorithm=$(jq -er '.Measurements.HashAlgorithm | strings | select(length > 0)' "$measurements")"
            echo "pcr0=$(jq -er '.Measurements.PCR0 | strings | select(length > 0)' "$measurements")"
            echo "pcr1=$(jq -er '.Measurements.PCR1 | strings | select(length > 0)' "$measurements")"
            echo "pcr2=$(jq -er '.Measurements.PCR2 | strings | select(length > 0)' "$measurements")"
          } >> "$GITHUB_OUTPUT"

      - name: Bind measurements to this build and genesis
        env:
          PROVER_BINARY_SHA256: ${{ steps.compiled.outputs.binary_sha }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg genesis_sha256 "$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)" \
            --arg binary_sha256 "$PROVER_BINARY_SHA256" \
            '{sha: $sha, attempt: $attempt, genesis_sha256: $genesis_sha256, binary_sha256: $binary_sha256}' \
            > target/tempo-zone-prover-eif/identity.json

      - name: Upload tempo-zone-prover PCR measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone-prover-measurements-${{ steps.shortsha.outputs.shortsha }}${{ inputs.defer_genesis && format('-{0}', github.run_attempt) || '' }}
          path: |
            target/tempo-zone-prover-eif/measurements.json
            target/tempo-zone-prover-eif/identity.json
          if-no-files-found: error

      - name: Build and push tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          provenance: false
          files: |
            docker/docker-bake.hcl
            ${{ steps.meta-tempo-zone-prover.outputs.bake-file }}
          targets: tempo-zone-prover
          set: |
            tempo-zone-prover.tags=tempo-zone-prover:candidate
            tempo-zone-prover.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-zone-prover.tar
            tempo-zone-prover.args.NITRO_HASH_ALGORITHM=${{ steps.prover_measurements.outputs.hash_algorithm }}
            tempo-zone-prover.args.NITRO_PCR0=${{ steps.prover_measurements.outputs.pcr0 }}
            tempo-zone-prover.args.NITRO_PCR1=${{ steps.prover_measurements.outputs.pcr1 }}
            tempo-zone-prover.args.NITRO_PCR2=${{ steps.prover_measurements.outputs.pcr2 }}
          project: 0c6tg19qsp
          no-cache: true
          pull: true

      - name: Upload candidate image archives
        id: images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-docker-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-images/*.tar
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish-companion-images:
    name: Publish companion Docker images
    needs: build-and-push
    if: >-
      github.repository == 'tempoxyz/zones' &&
      github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
      - name: Download candidate image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-and-push.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-images
      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-xtask
            docker.io/tempoxyz/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover
            docker.io/tempoxyz/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover-utils
            docker.io/tempoxyz/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Publish fixed companion image names
        env:
          XTASK_TAGS: ${{ steps.meta-tempo-zone-xtask.outputs.tags }}
          PROVER_TAGS: ${{ steps.meta-tempo-zone-prover.outputs.tags }}
          UTILS_TAGS: ${{ steps.meta-tempo-zone-prover-utils.outputs.tags }}
          BUILDER_REF: ${{ needs.build-and-push.outputs.builder_ref }}
        run: |
          set -euo pipefail
          publish() {
            local image="$1" metadata="$2" tag
            docker load --input "$RUNNER_TEMP/candidate-images/$image.tar"
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              [[ "$tag" == "$REGISTRY/$image:"* || "$tag" == "docker.io/tempoxyz/$image:"* ]]
              docker tag "$image:candidate" "$tag"
              docker push "$tag"
            done <<< "$metadata"
          }
          publish tempo-zone-xtask "$XTASK_TAGS"
          publish tempo-zone-prover "$PROVER_TAGS"
          publish tempo-zone-prover-utils "$UTILS_TAGS"
          if [[ -f "$RUNNER_TEMP/candidate-images/eif-builder.tar" ]]; then
            [[ "$BUILDER_REF" =~ ^ghcr.io/tempoxyz/tempo-zone-prover-eif-builder:inputs-[0-9a-f]{64}$ ]]
            docker load --input "$RUNNER_TEMP/candidate-images/eif-builder.tar"
            docker tag tempo-zone-prover-eif-builder:local "$BUILDER_REF"
            docker push "$BUILDER_REF"
          fi

  production-reproducible-clean-rebuild:
    name: Rebuild production contract without Docker cache
    needs: resolve-production-build-inputs
    if: >-
      github.repository == 'tempoxyz/zones' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.reproducible_verify != true))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      clean_sha256: ${{ steps.hash.outputs.sha256 }}
      clean_runtime_config_sha256: ${{ steps.hash.outputs.runtime_config_sha256 }}
      clean_ca_bundle_sha256: ${{ steps.hash.outputs.ca_bundle_sha256 }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Check out resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Build production contract without Docker or BuildKit cache
        env:
          GIT_SHA: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.resolve-production-build-inputs.outputs.source_date_epoch }}
          VERSION: ${{ needs.resolve-production-build-inputs.outputs.version }}
          NO_CACHE: "1"
          RUNTIME_IMAGE: tempo-zone-clean:${{ github.run_id }}
        run: |
          set -euo pipefail
          docker builder prune --all --force
          scripts/reproducible-build.sh

      - name: Hash clean rebuild
        id: hash
        shell: bash
        env:
          RUNTIME_IMAGE: tempo-zone-clean:${{ github.run_id }}
        run: |
          set -euo pipefail

          sha256="$(sha256sum out/tempo-zone | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid clean-build SHA-256: $sha256" >&2
            exit 1
          }

          runtime_config="$(docker image inspect "$RUNTIME_IMAGE" --format '{{json .Config}}' | \
            jq -cS '{Entrypoint, Cmd, Env, WorkingDir, User, ExposedPorts, Volumes, Healthcheck, StopSignal}')"
          runtime_config_sha256="$(printf '%s' "$runtime_config" | sha256sum | awk '{print $1}')"
          [[ "$runtime_config_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid clean runtime-config SHA-256: $runtime_config_sha256" >&2
            exit 1
          }

          container_id="$(docker create "$RUNTIME_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/etc/ssl/certs/ca-certificates.crt" "$RUNNER_TEMP/ca-certificates.crt"
          ca_bundle_sha256="$(sha256sum "$RUNNER_TEMP/ca-certificates.crt" | awk '{print $1}')"
          [[ "$ca_bundle_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid clean CA-bundle SHA-256: $ca_bundle_sha256" >&2
            exit 1
          }

          {
            echo "sha256=$sha256"
            echo "runtime_config_sha256=$runtime_config_sha256"
            echo "ca_bundle_sha256=$ca_bundle_sha256"
          } >> "$GITHUB_OUTPUT"

  production-reproducible-verify:
    name: Verify candidate tempo-zone binary and runtime inputs
    needs:
      - resolve-production-build-inputs
      - build-and-push
      - production-reproducible-clean-rebuild
    if: >-
      github.repository == 'tempoxyz/zones' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.reproducible_verify != true))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.compare.outputs.image_digest }}
      image_sha256: ${{ steps.compare.outputs.image_sha256 }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Download candidate image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-and-push.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-images

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare candidate runtime inputs and stage verified image
        id: compare
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.resolve-production-build-inputs.outputs.source_date_epoch }}
          VERSION: ${{ needs.resolve-production-build-inputs.outputs.version }}
          IMAGE_REPOSITORY: ${{ env.STAGING_REPOSITORY }}
          IMAGE_TAG: ${{ needs.resolve-production-build-inputs.outputs.staging_tag }}
          CLEAN_SHA256: ${{ needs.production-reproducible-clean-rebuild.outputs.clean_sha256 }}
          CLEAN_RUNTIME_CONFIG_SHA256: ${{ needs.production-reproducible-clean-rebuild.outputs.clean_runtime_config_sha256 }}
          CLEAN_CA_BUNDLE_SHA256: ${{ needs.production-reproducible-clean-rebuild.outputs.clean_ca_bundle_sha256 }}
          BINARY_PATH: /usr/local/bin/tempo-zone
          CONTRACT_NAME: tempo-zone-linux-x86_64-reproducible
          CONTRACT_VERSION: "1"
          MANIFEST: ${{ runner.temp }}/production-reproducible-image-verification.json
        run: |
          set -Eeuo pipefail

          image_digest=""
          image_sha256=""
          image_runtime_config_sha256=""
          image_ca_bundle_sha256=""
          comparison_result="failed"
          failure=""
          container_id=""

          write_manifest() {
            jq -n \
              --arg commit_sha "$COMMIT_SHA" \
              --arg source_date_epoch "$SOURCE_DATE_EPOCH" \
              --arg version "$VERSION" \
              --arg contract_name "$CONTRACT_NAME" \
              --arg contract_version "$CONTRACT_VERSION" \
              --arg image_repository "$IMAGE_REPOSITORY" \
              --arg image_digest "$image_digest" \
              --arg binary_path "$BINARY_PATH" \
              --arg image_sha256 "$image_sha256" \
              --arg image_runtime_config_sha256 "$image_runtime_config_sha256" \
              --arg image_ca_bundle_sha256 "$image_ca_bundle_sha256" \
              --arg clean_build_sha256 "$CLEAN_SHA256" \
              --arg clean_runtime_config_sha256 "$CLEAN_RUNTIME_CONFIG_SHA256" \
              --arg clean_ca_bundle_sha256 "$CLEAN_CA_BUNDLE_SHA256" \
              --arg binary_comparison_result "$comparison_result" \
              --arg failure "$failure" \
              '{
                commit_sha: $commit_sha,
                contract: {
                  name: $contract_name,
                  version: $contract_version,
                  source_date_epoch: $source_date_epoch,
                  target: "x86_64-unknown-linux-gnu",
                  cargo_profile: "reproducible",
                  cargo_features: ["jemalloc"]
                },
                verification_scope: "tempo-zone binary, runtime execution config, and CA bundle",
                candidate_image: {
                  repository: $image_repository,
                  digest: $image_digest,
                  binary_path: $binary_path,
                  binary_sha256: $image_sha256,
                  runtime_config_sha256: $image_runtime_config_sha256,
                  ca_bundle_sha256: $image_ca_bundle_sha256
                },
                clean_build_sha256: $clean_build_sha256,
                clean_runtime_config_sha256: $clean_runtime_config_sha256,
                clean_ca_bundle_sha256: $clean_ca_bundle_sha256,
                binary_comparison_result: $binary_comparison_result,
                failure: $failure
              }' > "$MANIFEST"
          }

          cleanup() {
            status=$?
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            write_manifest
            exit "$status"
          }
          trap cleanup EXIT

          docker load --input "$RUNNER_TEMP/candidate-images/tempo-zone.tar"
          immutable_image=tempo-zone:candidate
          container_id="$(docker create "$immutable_image")"
          docker cp "$container_id:$BINARY_PATH" "$RUNNER_TEMP/tempo-zone"
          image_sha256="$(sha256sum "$RUNNER_TEMP/tempo-zone" | awk '{print $1}')"
          [[ "$image_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            failure="invalid image binary SHA-256"
            echo "Invalid image binary SHA-256: $image_sha256" >&2
            exit 1
          }

          image_runtime_config="$(docker image inspect "$immutable_image" --format '{{json .Config}}' | \
            jq -cS '{Entrypoint, Cmd, Env, WorkingDir, User, ExposedPorts, Volumes, Healthcheck, StopSignal}')"
          image_runtime_config_sha256="$(printf '%s' "$image_runtime_config" | sha256sum | awk '{print $1}')"
          docker cp "$container_id:/etc/ssl/certs/ca-certificates.crt" "$RUNNER_TEMP/ca-certificates.crt"
          image_ca_bundle_sha256="$(sha256sum "$RUNNER_TEMP/ca-certificates.crt" | awk '{print $1}')"

          [[ "$image_runtime_config_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            failure="invalid image runtime-config SHA-256"
            echo "Invalid image runtime-config SHA-256: $image_runtime_config_sha256" >&2
            exit 1
          }
          [[ "$image_ca_bundle_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            failure="invalid image CA-bundle SHA-256"
            echo "Invalid image CA-bundle SHA-256: $image_ca_bundle_sha256" >&2
            exit 1
          }

          if [[ "$image_sha256" == "$CLEAN_SHA256" && \
              "$image_runtime_config_sha256" == "$CLEAN_RUNTIME_CONFIG_SHA256" && \
              "$image_ca_bundle_sha256" == "$CLEAN_CA_BUNDLE_SHA256" ]]; then
            comparison_result="success"
            echo "Staged tempo-zone binary and runtime inputs match the clean rebuild"
          else
            failure="staged binary or runtime input does not match clean rebuild"
            echo "::error::Staged production reproducibility verification mismatch"
            exit 1
          fi

          # Registry write access exists only on this fresh verification runner.
          # No candidate executable or build script runs here.
          tagged_image="$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker tag "$immutable_image" "$tagged_image"
          docker push "$tagged_image"
          image_digest="$(docker buildx imagetools inspect "$tagged_image" --format '{{.Manifest.Digest}}')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            echo "image_digest=$image_digest"
            echo "image_sha256=$image_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-reproducible-image-verification-${{ needs.resolve-production-build-inputs.outputs.short_sha }}
          path: ${{ runner.temp }}/production-reproducible-image-verification.json
          if-no-files-found: warn
          retention-days: 7

  promote-verified-tempo-zone:
    name: Promote verified tempo-zone image
    needs:
      - resolve-production-build-inputs
      - build-and-push
      - production-reproducible-verify
      - publish-companion-images
    if: >-
      needs.production-reproducible-verify.result == 'success' &&
      github.repository == 'tempoxyz/zones' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.reproducible_verify != true))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.promote.outputs.image_digest }}
      binary_sha256: ${{ steps.promote.outputs.binary_sha256 }}
      image_sha_tag: ${{ steps.promote.outputs.image_sha_tag }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata for promoted tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone
            docker.io/tempoxyz/tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ inputs.nightly == true }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-

      - name: Promote the verified manifest and recheck its binary
        id: promote
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/tempo-zone
          DOCKER_HUB_REPOSITORY: docker.io/tempoxyz/tempo-zone
          STAGING_REPOSITORY: ${{ env.STAGING_REPOSITORY }}
          STAGING_DIGEST: ${{ needs.production-reproducible-verify.outputs.image_digest }}
          VERIFIED_BINARY_SHA256: ${{ needs.production-reproducible-verify.outputs.image_sha256 }}
          METADATA_TAGS: ${{ steps.meta-tempo-zone.outputs.tags }}
          BINARY_PATH: /usr/local/bin/tempo-zone
        run: |
          set -Eeuo pipefail

          [[ "$STAGING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid staged image digest: $STAGING_DIGEST" >&2
            exit 1
          }
          [[ "$VERIFIED_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid verified binary SHA-256: $VERIFIED_BINARY_SHA256" >&2
            exit 1
          }

          mapfile -t metadata_tags <<< "$METADATA_TAGS"
          tag_args=()
          tags=()
          image_sha_tag=""
          for tag in "${metadata_tags[@]}"; do
            tag="${tag%$'\r'}"
            [[ -z "$tag" ]] && continue
            [[ "$tag" == "$IMAGE_REPOSITORY:"* || "$tag" == "$DOCKER_HUB_REPOSITORY:"* ]] || {
              echo "Unexpected tempo-zone tag: $tag" >&2
              exit 1
            }
            tag_args+=(--tag "$tag")
            tags+=("$tag")
            if [[ "$tag" == "$IMAGE_REPOSITORY:"* && "$tag" =~ :sha-[0-9a-f]{7}$ ]]; then
              [[ -z "$image_sha_tag" ]] || {
                echo "Multiple Docker SHA tags were generated" >&2
                exit 1
              }
              image_sha_tag="$tag"
            fi
          done
          (( ${#tags[@]} > 0 )) || {
            echo "No production tempo-zone tags were generated" >&2
            exit 1
          }
          [[ -n "$image_sha_tag" ]] || {
            echo "No Docker SHA tag was generated" >&2
            exit 1
          }

          source_image="$STAGING_REPOSITORY@$STAGING_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            "${tag_args[@]}" "$source_image"

          for tag in "${tags[@]}"; do
            tag_digest=""
            for attempt in {1..12}; do
              tag_digest="$(docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              if [[ "$tag_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
              echo "Waiting for $tag to become readable (attempt $attempt/12)"
              sleep 5
            done
            [[ "$tag_digest" == "$STAGING_DIGEST" ]] || {
              echo "Promotion changed $tag from $STAGING_DIGEST to $tag_digest" >&2
              exit 1
            }
          done

          container_id=""
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          docker pull "$source_image"
          container_id="$(docker create "$source_image")"
          docker cp "$container_id:$BINARY_PATH" "$RUNNER_TEMP/tempo-zone"
          promoted_sha256="$(sha256sum "$RUNNER_TEMP/tempo-zone" | awk '{print $1}')"
          [[ "$promoted_sha256" == "$VERIFIED_BINARY_SHA256" ]] || {
            echo "Promoted tempo-zone binary checksum changed" >&2
            exit 1
          }

          {
            echo "image_digest=$STAGING_DIGEST"
            echo "binary_sha256=$promoted_sha256"
            echo "image_sha_tag=$image_sha_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Zones CI event
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          COMMIT_SHA: ${{ needs.resolve-production-build-inputs.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.image_digest }}
          IMAGE_SHA_TAG: ${{ steps.promote.outputs.image_sha_tag }}
        run: |
          set -euo pipefail

          tag="${IMAGE_SHA_TAG##*:}"
          [[ "$tag" =~ ^sha-[0-9a-f]{7}$ ]] || {
            echo "Invalid promoted Docker SHA tag: $IMAGE_SHA_TAG" >&2
            exit 1
          }

          install -m 0700 -d "$RUNNER_TEMP/events"
          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/events/key.pem"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/events/cert.pem"
          payload=$(jq -cn \
            --arg tag "$tag" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            '{
              repository: "tempoxyz/zones",
              event: "registry_package",
              data: {
                tag: $tag,
                sha: $sha,
                branch: $branch,
                digest: $digest
              }
            }')
          command -v python3 >/dev/null || {
            echo "python3 is required to parse EVENTS_ARGS" >&2
            exit 1
          }
          mapfile -t events_args < <(
            python3 - "$EVENTS_ARGS" <<'PY'
          import shlex
          import sys

          for argument in shlex.split(sys.argv[1]):
              print(argument)
          PY
          )
          (( ${#events_args[@]} > 0 )) || {
            echo "EVENTS_ARGS is empty" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --key "$RUNNER_TEMP/events/key.pem" \
            --cert "$RUNNER_TEMP/events/cert.pem" \
            "${events_args[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload"
