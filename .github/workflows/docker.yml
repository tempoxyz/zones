name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      reproducible_verify:
        description: "Verify a non-production reproducible candidate image"
        type: boolean
        default: false
      ref:
        description: "Optional branch, tag, or SHA to verify (defaults to this workflow's commit)"
        type: string
        required: false
        default: ""
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        type: string
        default: ""
  workflow_call:
    inputs:
      defer_genesis:
        description: "Wait for the devnet genesis after compilation (E2E only)"
        type: boolean
        default: false
      tempo_genesis_url:
        description: "Tempo genesis JSON URL to embed in the prover image"
        required: false
        type: string
        default: "https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json"
      source_sha:
        description: "Deprecated compatibility input; ignored (images are built from the checked-out commit)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tempoxyz
  TEMPO_DEVNET_GENESIS_URL: ${{ inputs.tempo_genesis_url || 'https://devnet-assets.tempoxyz.dev/tempo-devnet-nextfork.json' }}

jobs:
  reproducible-verify-resolve:
    name: Resolve reproducible verification commit
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reproducible_verify == true &&
      github.repository == 'tempoxyz/zones'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      source_date_epoch: ${{ steps.commit.outputs.source_date_epoch }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Record immutable build inputs
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"

          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Resolved ref is not a full commit SHA: $commit_sha" >&2
            exit 1
          }
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]] || {
            echo "Invalid SOURCE_DATE_EPOCH: $source_date_epoch" >&2
            exit 1
          }

          {
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "source_date_epoch=$source_date_epoch"
            echo "version=sha-$short_sha"
          } >> "$GITHUB_OUTPUT"

  reproducible-verify-depot-build-and-push:
    name: Build and push reproducible candidate
    needs: reproducible-verify-resolve
    if: github.repository == 'tempoxyz/zones'
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      candidate_repository: ${{ steps.candidate.outputs.repository }}
      candidate_tag: ${{ steps.candidate.outputs.tag }}
    env:
      CANDIDATE_REPOSITORY: ghcr.io/tempoxyz/tempo-zone-repro
      SOURCE_DATE_EPOCH: ${{ needs.reproducible-verify-resolve.outputs.source_date_epoch }}
      GIT_SHA: ${{ needs.reproducible-verify-resolve.outputs.commit_sha }}
      VERSION: ${{ needs.reproducible-verify-resolve.outputs.version }}
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.reproducible-verify-resolve.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set candidate image reference
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: run-${{ github.run_id }}-${{ needs.reproducible-verify-resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          echo "repository=$CANDIDATE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push reproducible candidate image
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        with:
          files: docker/docker-bake.hcl
          targets: tempo-zone-reproducible
          project: 0c6tg19qsp
          push: true
          set: |
            tempo-zone-reproducible.tags=${{ steps.candidate.outputs.repository }}:${{ steps.candidate.outputs.tag }}

  reproducible-verify-clean-rebuild:
    name: Rebuild reproducibly without Docker cache
    needs: reproducible-verify-resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      clean_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.reproducible-verify-resolve.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Build reproducibly without Docker or BuildKit cache
        env:
          VERSION: ${{ needs.reproducible-verify-resolve.outputs.version }}
          NO_CACHE: "1"
        run: |
          set -euo pipefail
          docker builder prune --all --force
          scripts/reproducible-build.sh

      - name: Hash clean rebuild
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum out/tempo-zone | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid clean-build SHA-256: $sha256" >&2
            exit 1
          }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  reproducible-verify-extract-and-compare:
    name: Extract and compare reproducible candidate
    needs:
      - reproducible-verify-resolve
      - reproducible-verify-depot-build-and-push
      - reproducible-verify-clean-rebuild
    if: github.repository == 'tempoxyz/zones'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract candidate binary and compare checksums
        id: compare
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.reproducible-verify-resolve.outputs.commit_sha }}
          CANDIDATE_REPOSITORY: ${{ needs.reproducible-verify-depot-build-and-push.outputs.candidate_repository }}
          CANDIDATE_TAG: ${{ needs.reproducible-verify-depot-build-and-push.outputs.candidate_tag }}
          CLEAN_SHA256: ${{ needs.reproducible-verify-clean-rebuild.outputs.clean_sha256 }}
          BINARY_PATH: /usr/local/bin/tempo-zone
          MANIFEST: ${{ runner.temp }}/reproducible-image-verification.json
        run: |
          set -Eeuo pipefail

          image_digest=""
          depot_sha256=""
          comparison_result="failed"
          failure=""
          container_id=""

          write_manifest() {
            jq -n \
              --arg commit_sha "$COMMIT_SHA" \
              --arg candidate_repository "$CANDIDATE_REPOSITORY" \
              --arg candidate_tag "$CANDIDATE_TAG" \
              --arg image_digest "$image_digest" \
              --arg binary_path "$BINARY_PATH" \
              --arg depot_sha256 "$depot_sha256" \
              --arg clean_build_sha256 "$CLEAN_SHA256" \
              --arg comparison_result "$comparison_result" \
              --arg failure "$failure" \
              '{
                commit_sha: $commit_sha,
                candidate_repository: $candidate_repository,
                candidate_tag: $candidate_tag,
                image_digest: $image_digest,
                binary_path: $binary_path,
                depot_sha256: $depot_sha256,
                clean_build_sha256: $clean_build_sha256,
                comparison_result: $comparison_result,
                failure: $failure
              }' > "$MANIFEST"
          }

          cleanup() {
            status=$?
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            write_manifest
            exit "$status"
          }
          trap cleanup EXIT

          tagged_image="$CANDIDATE_REPOSITORY:$CANDIDATE_TAG"
          for attempt in {1..12}; do
            image_digest="$(docker buildx imagetools inspect "$tagged_image" \
              --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for $tagged_image to become readable (attempt $attempt/12)"
            sleep 5
          done
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            failure="could not resolve candidate image digest"
            echo "Could not resolve a valid digest for $tagged_image" >&2
            exit 1
          fi

          immutable_image="$CANDIDATE_REPOSITORY@$image_digest"
          docker pull "$immutable_image"
          container_id="$(docker create "$immutable_image")"
          docker cp "$container_id:$BINARY_PATH" "$RUNNER_TEMP/tempo-zone"
          depot_sha256="$(sha256sum "$RUNNER_TEMP/tempo-zone" | awk '{print $1}')"

          if [[ "$depot_sha256" == "$CLEAN_SHA256" ]]; then
            comparison_result="success"
            echo "Reproducible candidate binary checksum matches clean rebuild"
          else
            failure="candidate binary checksum does not match clean rebuild"
            echo "::error::Reproducible image verification mismatch"
          fi

          {
            echo "comparison_result=$comparison_result"
            echo "image_digest=$image_digest"
            echo "depot_sha256=$depot_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-image-verification-${{ needs.reproducible-verify-resolve.outputs.short_sha }}
          path: ${{ runner.temp }}/reproducible-image-verification.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on checksum mismatch
        if: steps.compare.outputs.comparison_result == 'failed'
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.reproducible-verify-resolve.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ steps.compare.outputs.image_digest }}
          DEPOT_SHA256: ${{ steps.compare.outputs.depot_sha256 }}
          CLEAN_SHA256: ${{ needs.reproducible-verify-clean-rebuild.outputs.clean_sha256 }}
          BINARY_PATH: /usr/local/bin/tempo-zone
        run: |
          set -euo pipefail
          echo "Reproducible image verification failed:" >&2
          echo "  commit SHA: $COMMIT_SHA" >&2
          echo "  image digest: $IMAGE_DIGEST" >&2
          echo "  binary path: $BINARY_PATH" >&2
          echo "  Depot SHA-256: $DEPOT_SHA256" >&2
          echo "  clean-build SHA-256: $CLEAN_SHA256" >&2
          exit 1

  build-and-push:
    name: Build and Push Docker Images
    # Private copies retain PR image builds, but must not publish shared images
    # or run the upstream's scheduled refreshes.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.reproducible_verify != true) &&
      (github.repository == 'tempoxyz/zones' ||
      (github.event_name != 'schedule' && github.event_name != 'push'))
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Docker metadata for tempo-zone
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone
            docker.io/tempoxyz/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-xtask
        id: meta-tempo-zone-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-xtask
            docker.io/tempoxyz/tempo-zone-xtask
          bake-target: tempo-zone-xtask
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover
        id: meta-tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover
            docker.io/tempoxyz/tempo-zone-prover
          bake-target: tempo-zone-prover
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Docker metadata for tempo-zone-prover-utils
        id: meta-tempo-zone-prover-utils
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-zone-prover-utils
            docker.io/tempoxyz/tempo-zone-prover-utils
          bake-target: tempo-zone-prover-utils
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to Container Registry
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository == 'tempoxyz/zones'
        uses: tempoxyz/gh-actions/vendor/docker/login-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure persistent intermediate layer cache
        env:
          WRITE_BUILD_CACHE: ${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          targets = ["chef", "prover-chef", "tempo-zone", "tempo-zone-xtask",
                     "tempo-zone-prover-utils", "tempo-zone-prover-enclave",
                     "tempo-zone-prover", "tempo-zone-prover-eif-builder",
                     "tempo-zone-prover-compiled"]
          cache = {"target": {}}
          for target in targets:
              ref = f"{os.environ['REGISTRY']}/tempo-zone-buildcache:{target}"
              entry = {"cache-from": [f"type=registry,ref={ref}"]}
              if os.environ["WRITE_BUILD_CACHE"] == "true":
                  entry["cache-to"] = [f"type=registry,ref={ref},mode=max"]
              cache["target"][target] = entry
          with open(os.path.join(os.environ["RUNNER_TEMP"], "zones-buildcache.json"), "w") as f:
              json.dump(cache, f)
          PYTHON

      - name: Resolve cached EIF builder
        id: eif_builder
        env:
          REFRESH_BUILDER: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # Include the pinned kernel source and CLI recipe in the cache identity.
          key=$(cat docker/Dockerfile.prover-eif-builder docker/docker-bake.hcl | sha256sum | cut -d' ' -f1)
          ref="$REGISTRY/tempo-zone-prover-eif-builder:inputs-$key"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$REFRESH_BUILDER" != 'true' ]] && docker pull --platform linux/amd64 "$ref"; then
            # Use the resolved immutable digest throughout this run.
            image=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=tempo-zone-prover-eif-builder:local" >> "$GITHUB_OUTPUT"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile all binaries and publish images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-xtask.outputs.bake-file }}
            ${{ steps.meta-tempo-zone-prover-utils.outputs.bake-file }}
          targets: |
            default
            tempo-zone-prover-compiled
          project: 0c6tg19qsp
          # Export only the executable for the later genesis packaging step.
          set: |
            tempo-zone-prover-compiled.target=compiled
            tempo-zone-prover-compiled.output=type=local,dest=target/prover-compiled
            tempo-zone.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
            tempo-zone-xtask.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
            tempo-zone-prover-utils.output=type=image,push=${{ github.repository == 'tempoxyz/zones' && github.event_name != 'pull_request' }}
          # Scheduled builds refresh moving external tools and base images. All
          # commit/tag/manual builds can safely reuse Depot's content-addressed
          # layer cache and will still invalidate layers when inputs change.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}

      - name: Mark compilation complete
        id: compiled
        run: |
          binary_sha=$(sha256sum target/prover-compiled/tempo-zone-prover-enclave | cut -d' ' -f1)
          echo "binary_sha=$binary_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_sha256 "$binary_sha" \
            '{sha: $sha, attempt: $attempt, binary_sha256: $binary_sha256}' > "$RUNNER_TEMP/compilation.json"

      - name: Upload compilation marker
        if: inputs.defer_genesis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prover-compiled-${{ steps.shortsha.outputs.shortsha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compilation.json
          if-no-files-found: error

      - name: Download Tempo devnet genesis
        shell: bash
        env:
          DEFER_GENESIS: ${{ inputs.defer_genesis }}
        run: |
          set -euo pipefail

          mkdir -p .tempo-genesis
          # Compilation has finished; the caller can now select the fork time.
          # Bound the rendezvous so an interrupted caller cannot strand a runner.
          deadline=$((SECONDS + 180))
          until curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 --location \
            --output .tempo-genesis/genesis.json "$TEMPO_DEVNET_GENESIS_URL"; do
            if [[ "${DEFER_GENESIS}" != true ]] || (( SECONDS >= deadline )); then
              echo "Genesis download failed or timed out" >&2
              exit 1
            fi
            sleep 1
          done
          jq -e '.config.chainId | type == "number"' \
            .tempo-genesis/genesis.json >/dev/null

          genesis_sha=$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)
          echo "Embedding Tempo devnet genesis sha256:${genesis_sha}"

      # Nitro CLI converts images from the runner's local Docker image store.
      # Bake both independent inputs together so BuildKit can build them in parallel.
      - name: Load tempo-zone-prover EIF inputs
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
          targets: ${{ steps.eif_builder.outputs.hit == 'true' && 'tempo-zone-prover-enclave' || 'prover-eif-inputs' }}
          set: |
            tempo-zone-prover-enclave.tags=tempo-zone-prover-enclave:eif-source
            tempo-zone-prover-enclave.dockerfile=docker/Dockerfile.prover-package
            tempo-zone-prover-enclave.contexts.chef=.
            tempo-zone-prover-enclave.contexts.prover-binary=target/prover-compiled
            tempo-zone-prover-enclave.args.PROVER_BINARY_SHA256=${{ steps.compiled.outputs.binary_sha }}
            tempo-zone-prover-enclave.contexts.tempo-genesis=.tempo-genesis
            tempo-zone-prover-eif-builder.tags=tempo-zone-prover-eif-builder:local
            tempo-zone-prover-eif-builder.no-cache=${{ github.event_name == 'schedule' }}
          project: 0c6tg19qsp
          load: true
          # Compilation was already refreshed in the first Bake call.
          pull: ${{ github.event_name == 'schedule' }}

      - name: Publish EIF builder cache
        if: >-
          steps.eif_builder.outputs.hit != 'true' &&
          github.repository == 'tempoxyz/zones' &&
          github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          BUILDER_REF: ${{ steps.eif_builder.outputs.ref }}
        run: |
          set -euo pipefail
          docker tag tempo-zone-prover-eif-builder:local "$BUILDER_REF"
          docker push "$BUILDER_REF"

      - name: Build tempo-zone-prover EIF
        env:
          PROVER_IMAGE: tempo-zone-prover-enclave:eif-source
          EIF_BUILDER_IMAGE: ${{ steps.eif_builder.outputs.image }}
          EIF_OUTPUT_DIR: target/tempo-zone-prover-eif
        run: |
          set -Eeuo pipefail

          mkdir -p "$EIF_OUTPUT_DIR"

          docker run --rm \
            --platform linux/amd64 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/$EIF_OUTPUT_DIR:/output" \
            "$EIF_BUILDER_IMAGE" \
            build-enclave \
            --docker-uri "$PROVER_IMAGE" \
            --output-file /output/tempo-zone-prover.eif \
            | tee "$EIF_OUTPUT_DIR/measurements.json"

      - name: Read tempo-zone-prover PCR measurements
        id: prover_measurements
        shell: bash
        run: |
          set -Eeuo pipefail

          measurements=target/tempo-zone-prover-eif/measurements.json
          {
            echo "hash_algorithm=$(jq -er '.Measurements.HashAlgorithm | strings | select(length > 0)' "$measurements")"
            echo "pcr0=$(jq -er '.Measurements.PCR0 | strings | select(length > 0)' "$measurements")"
            echo "pcr1=$(jq -er '.Measurements.PCR1 | strings | select(length > 0)' "$measurements")"
            echo "pcr2=$(jq -er '.Measurements.PCR2 | strings | select(length > 0)' "$measurements")"
          } >> "$GITHUB_OUTPUT"

      - name: Bind measurements to this build and genesis
        env:
          PROVER_BINARY_SHA256: ${{ steps.compiled.outputs.binary_sha }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg genesis_sha256 "$(sha256sum .tempo-genesis/genesis.json | cut -d' ' -f1)" \
            --arg binary_sha256 "$PROVER_BINARY_SHA256" \
            '{sha: $sha, attempt: $attempt, genesis_sha256: $genesis_sha256, binary_sha256: $binary_sha256}' \
            > target/tempo-zone-prover-eif/identity.json

      - name: Upload tempo-zone-prover PCR measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone-prover-measurements-${{ steps.shortsha.outputs.shortsha }}${{ inputs.defer_genesis && format('-{0}', github.run_attempt) || '' }}
          path: |
            target/tempo-zone-prover-eif/measurements.json
            target/tempo-zone-prover-eif/identity.json
          if-no-files-found: error

      - name: Build and push tempo-zone-prover
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          files: |
            docker/docker-bake.hcl
            ${{ runner.temp }}/zones-buildcache.json
            ${{ steps.meta-tempo-zone-prover.outputs.bake-file }}
          targets: tempo-zone-prover
          set: |
            tempo-zone-prover.args.NITRO_HASH_ALGORITHM=${{ steps.prover_measurements.outputs.hash_algorithm }}
            tempo-zone-prover.args.NITRO_PCR0=${{ steps.prover_measurements.outputs.pcr0 }}
            tempo-zone-prover.args.NITRO_PCR1=${{ steps.prover_measurements.outputs.pcr1 }}
            tempo-zone-prover.args.NITRO_PCR2=${{ steps.prover_measurements.outputs.pcr2 }}
          project: 0c6tg19qsp
          push: >-
            ${{ github.repository == 'tempoxyz/zones' &&
                github.event_name != 'pull_request' &&
                github.event_name != 'merge_group' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}

      - name: Publish Zones CI event
        if: >-
          github.repository == 'tempoxyz/zones' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          SHORT_SHA: ${{ steps.shortsha.outputs.shortsha }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/tempo-zone:sha-${SHORT_SHA}"
          digest=""
          for attempt in {1..12}; do
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for $image to become readable (attempt $attempt/12)"
            sleep 5
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve a valid digest for $image" >&2
            exit 1
          }

          install -m 0700 -d "$RUNNER_TEMP/events"
          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/events/key.pem"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/events/cert.pem"
          payload=$(jq -cn \
            --arg tag "sha-${SHORT_SHA}" \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg digest "$digest" \
            '{
              repository: "tempoxyz/zones",
              event: "registry_package",
              data: {
                tag: $tag,
                sha: $sha,
                branch: $branch,
                digest: $digest
              }
            }')
          command -v python3 >/dev/null || {
            echo "python3 is required to parse EVENTS_ARGS" >&2
            exit 1
          }
          mapfile -t events_args < <(
            python3 - "$EVENTS_ARGS" <<'PY'
          import shlex
          import sys

          for argument in shlex.split(sys.argv[1]):
              print(argument)
          PY
          )
          (( ${#events_args[@]} > 0 )) || {
            echo "EVENTS_ARGS is empty" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --key "$RUNNER_TEMP/events/key.pem" \
            --cert "$RUNNER_TEMP/events/cert.pem" \
            "${events_args[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload"
