name: Build binaries

on:
  workflow_dispatch:
    inputs:
      profile:
        default: "maxperf"
        description: "Build profile"
        type: choice
        options:
          - "release"
          - "maxperf"
          - "profiling"

permissions: {}

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      RUSTC_WRAPPER: sccache
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@aaedf7a275e398ad81b2913d9a6cbfce791ecbfb

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          toolchain: 1.96.0

      - name: Setup mold linker
        uses: tempoxyz/gh-actions/actions/setup-mold@ab45d76f6e7420a094281a22aee1973ecc0754f8

      - name: Enable sccache
        uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          version: v0.15.0

      - name: Build binary
        env:
          PROFILE: ${{ inputs.profile || 'maxperf' }}
        run: cargo build --locked --bin tempo-zone --profile "$PROFILE"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-zone
          path: target/${{ inputs.profile || 'maxperf' }}/tempo-zone
          retention-days: 90
          if-no-files-found: error
