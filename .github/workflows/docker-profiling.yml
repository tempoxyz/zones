name: Docker Build (Profiling)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the profiling image (e.g., profiling-latest)"
        type: string
        default: "profiling"

env:
  REGISTRY: ghcr.io/tempoxyz

jobs:
  build-and-push:
    name: Build and Push Profiling Docker Images
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Docker metadata for tempo-zone-profiling
        id: meta-tempo-zone
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          images: ${{ env.REGISTRY }}/tempo-zone
          bake-target: tempo-zone
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=sha,prefix=${{ github.event.inputs.tag }}-sha-

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: shortsha
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          files: |
            docker/docker-bake.hcl
            docker/docker-bake-profiling.hcl
            ${{ steps.meta-tempo-zone.outputs.bake-file }}
          targets: tempo-zone
          project: 0c6tg19qsp
          push: true
          no-cache: true
          pull: true
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.shortsha.outputs.shortsha }}
