name: Docker Revision Cache

on:
  pull_request:
    paths:
      - crates/node/build.rs
      - crates/node/src/version.rs
      - crates/node/src/version/**
      - docker/Dockerfile
      - docker/stamp-revision.sh
      - docker/tests/**
      - .github/workflows/docker-revision-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          oidc: 'true'
      - name: Test binary stamping
        run: bash docker/tests/stamp-revision.sh
      - name: Compare SHA-only warm builds
        run: bash docker/tests/revision-cache.sh
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revision-cache-evidence
          path: ${{ runner.temp }}/revision-cache-evidence
          if-no-files-found: warn
