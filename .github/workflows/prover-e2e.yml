name: Prover E2E trials

"on":
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character Zones commit SHA to test
        type: string
        required: true
  merge_group:
  schedule:
    - cron: "40 8 * * *"

permissions:
  contents: read

# These trials deliberately do not configure a required check. Enable only after
# the dedicated event sensor and pinned workflow revision have been deployed.
jobs:
  dispatch:
    if: >-
      github.repository == 'tempoxyz/zones' &&
      vars.PROVER_E2E_TRIALS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'merge_group' && vars.PROVER_E2E_MERGE_QUEUE_ENABLED == 'true') ||
       (github.event_name == 'schedule' && vars.PROVER_E2E_NIGHTLY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
      # Never check out or execute candidate code in this privileged publisher.
      - name: Resolve candidate and seed owned pending status
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          script: |
            const ref = context.eventName === 'workflow_dispatch' ? process.env.INPUT_SHA
              : context.eventName === 'merge_group' ? context.payload.merge_group.head_sha : 'main';
            if (context.eventName !== 'schedule' && !/^[0-9a-f]{40}$/.test(ref)) {
              throw new Error('An exact lowercase candidate SHA is required');
            }
            const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref});
            if (ref !== 'main' && commit.sha !== ref) throw new Error('Candidate SHA mismatch');
            core.setOutput('sha', commit.sha);
            const owner = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: commit.sha, state: 'pending',
              context: 'Tempo Zone Prover E2E (experimental)',
              description: `${owner}: Preparing prover trial`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Publish dedicated prover trial event
        id: publish
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/prover-e2e.key"
          cert="$RUNNER_TEMP/prover-e2e.crt"
          trap 'rm -f "$key" "$cert"' EXIT
          printf '%s' "$EVENTS_KEY" > "$key"
          printf '%s' "$EVENTS_CERT" > "$cert"
          payload=$(jq -cn --arg sha "$SHA" --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg trigger "$GITHUB_EVENT_NAME" \
            '{repository:"tempoxyz/zones",event:"tempo_zone_prover_e2e",data:{sha:$sha,run:$run,trigger:$trigger}}')
          mapfile -t events_args < <(python3 -c 'import os,shlex; print("\n".join(shlex.split(os.environ["EVENTS_ARGS"])))')
          [[ ${#events_args[@]} -gt 0 && -n "${events_args[0]}" ]]
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-all-errors "${events_args[@]}" \
            --key "$key" --cert "$cert" -H 'Content-Type: application/json' --data "$payload"
      - name: Report dispatch failure if this attempt still owns the status
        if: always() && steps.candidate.outputs.sha != '' && steps.publish.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const owner = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const statusContext = 'Tempo Zone Prover E2E (experimental)';
            let latest;
            for await (const page of github.paginate.iterator(github.rest.repos.listCommitStatusesForRef, {
              ...context.repo, ref: process.env.SHA, per_page: 100,
            })) {
              latest = page.data.find(status => status.context === statusContext);
              if (latest) break;
            }
            if (!latest?.description?.startsWith(`${owner}: `)) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.SHA, context: statusContext, state: 'failure',
              description: `${owner}: Prover trial dispatch failed`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
