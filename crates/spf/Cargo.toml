[package]
name = "zone-spf"
description = "Stateless proof function for Tempo Zones"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-zone-contracts = { workspace = true, features = ["std"] }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives = { workspace = true, features = ["std"] }

# Tempo
tempo-chainspec.workspace = true
tempo-evm.workspace = true
tempo-primitives.workspace = true
tempo-precompiles.workspace = true
tempo-revm.workspace = true

# Alloy / REVM
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
reth-chainspec.workspace = true
reth-evm.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-trie-common.workspace = true
reth-trie-sparse.workspace = true
revm.workspace = true
serde = { workspace = true, optional = true }
thiserror = "2"

commonware-codec = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true }
commonware-parallel = { workspace = true, optional = true }
commonware-runtime = { workspace = true, optional = true }
commonware-storage = { workspace = true, optional = true }
commonware-utils = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["serde"]
qmdb = [
    "dep:commonware-codec",
    "dep:commonware-cryptography",
    "dep:commonware-parallel",
    "dep:commonware-runtime",
    "dep:commonware-storage",
    "dep:commonware-utils",
]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "tempo-zone-contracts/serde",
    "zone-primitives/serde",
]

[[example]]
name = "qmdb-data"
required-features = ["qmdb", "serde"]
