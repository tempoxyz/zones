[package]
name = "zone-checker"
description = "Observe-only Tempo Zone checker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
# reth
reth-codecs.workspace = true
reth-chainspec.workspace = true
reth-db.workspace = true
reth-exex.workspace = true
reth-execution-types.workspace = true
reth-metrics.workspace = true
reth-node-api.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true

# tempo
tempo-alloy.workspace = true
tempo-chainspec.workspace = true
tempo-contracts.workspace = true
tempo-precompiles.workspace = true
tempo-primitives.workspace = true
tempo-revm = { workspace = true, features = ["reth"] }

# zones
tempo-zone-contracts = { workspace = true, features = ["std"] }
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives = { workspace = true, features = ["std"] }

# misc
bytes.workspace = true
bincode.workspace = true
eyre.workspace = true
futures.workspace = true
metrics.workspace = true
serde.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-consensus = { workspace = true, features = ["std"] }
alloy-transport.workspace = true
reth-primitives-traits = { workspace = true, features = ["std", "test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
tokio.workspace = true

[features]
default = []
test-utils = []
