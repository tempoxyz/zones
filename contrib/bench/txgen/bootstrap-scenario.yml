version: 1

include:
  - ./scenario-fragments.yml

chains:
  l1:
    network: tempo
    rpc_url: "${L1_RPC_URL}"
    query_rpc_url: "${ZONES_BENCH_L1_QUERY_RPC_URL}"
    chain_id: ${ZONES_BENCH_EXPECTED_L1_CHAIN_ID}
    workload: ./bootstrap-deposit.yml

  zone:
    network: tempo
    # Bootstrap only queries the Zone. Submissions use the authenticated private
    # endpoint in roundtrip-scenario.yml after the token map has been generated.
    rpc_url: "${ZONE_RPC_URL}"
    query_rpc_url: "${ZONE_RPC_URL}"
    chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}
    workload: ./zone-roundtrip.yml

scenario:
  name: zones-bootstrap-deposit
  timeout: 10m

  bindings:
    account:
      account:
        pool: control
        select: lease

  steps:
    - submit:
        chain: l1
        template: control_portal_approval
        with:
          from: { var: account.ref }
        await: receipt
      save: control_portal_approval

    - checkpoint:
        chain: zone
      save: zone_before_deposit

    - checkpoint:
        chain: l1
      save: l1_before_deposit

    - use: deposit-and-wait-zone
      as: bootstrap_deposit
      with:
        template: bootstrap_deposit
        sender: { var: account.ref }
        sender_address: { var: account.address }
        recipient: "${ZONES_BENCH_SEQUENCER_ADDRESS}"
        amount: ${ZONES_BENCH_BOOTSTRAP_DEPOSIT_AMOUNT}
        zone_from_block: { var: zone_before_deposit.block_number }

    # DepositProcessed from the composed fragment is terminal here: it proves
    # the Zone credited the sequencer's sponsorship balance.
