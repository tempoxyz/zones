version: 1

fragments:
  deposit-and-wait-zone:
    parameters:
      template: string
      sender: account_ref
      sender_address: address
      recipient: address
      amount: u256
      zone_from_block: u256
    outputs:
      submission: submit
      deposit_made: log
      deposit_processed: log
    steps:
      - submit:
          chain: l1
          template: { param: template }
          with:
            from: { param: sender }
            call:
              args:
                - "${ZONES_BENCH_TOKEN}"
                - { param: recipient }
                - { param: amount }
                - { random_bytes: 32 }
                - { param: sender_address }
        save: submission

      # Capture the random memo and queue hash from this transaction's receipt.
      - wait_log:
          chain: l1
          transaction_hash: { var: submission.tx_hash }
          sender: { var: submission.sender }
          address: "${L1_PORTAL_ADDRESS}"
          abi: ZonePortal
          event: DepositMade
          where:
            sender: { param: sender_address }
            token: "${ZONES_BENCH_TOKEN}"
            to: { param: recipient }
        save: deposit_made

      - wait_log:
          chain: zone
          from_block: { param: zone_from_block }
          address: "${ZONES_BENCH_INBOX}"
          abi: ZoneInbox
          event: DepositProcessed
          where:
            depositHash: { var: deposit_made.args.newCurrentDepositQueueHash }
            sender: { param: sender_address }
            to: { param: recipient }
            token: "${ZONES_BENCH_TOKEN}"
            amount: { var: deposit_made.args.netAmount }
            memo: { var: deposit_made.args.memo }
          max_block_range: 1000
        save: deposit_processed
