chain_id: __L1_CHAIN_ID__

gas:
  max_fee_per_gas: __L1_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __L1_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  control:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__CONTROL_ACCOUNT_INDEX__, __CONTROL_ACCOUNT_END__]

artifacts:
  TIP20: abis/tip20.json
  ZonePortal: abis/zone-portal.json

# Preflight injects the control account's portal approval here when needed.
# Setup finishes before scenario timing starts.
setup: { steps: [] }

templates:
  bootstrap_deposit:
    type: tempo
    from: { var: account.ref }
    gas_limit: __DEPOSIT_GAS_LIMIT__
    fee_token: "__TOKEN__"
    call:
      to: "__PORTAL__"
      abi: ZonePortal
      function: "deposit(address,address,uint128,bytes32,address)"
      args:
        - "__TOKEN__"
        - "__SEQUENCER__"
        - __BOOTSTRAP_DEPOSIT_AMOUNT__
        - { random_bytes: 32 }
        - { var: account.address }

sequences:
  bootstrap:
    bindings:
      account:
        account:
          pool: control
          select: { index: 0 }
    steps:
      - name: deposit
        template: bootstrap_deposit

mix:
  - sequence: bootstrap
    weight: 100
