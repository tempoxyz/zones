chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}

gas:
  max_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_ACCOUNT_START}, ${ZONES_BENCH_ACCOUNT_END}]

artifacts:
  TIP20: abis/tip20.json
  ZoneOutbox: abis/zone-outbox.json

templates:
  request_withdrawal:
    type: tempo
    from: { var: account.ref }
    gas_limit: ${ZONES_BENCH_WITHDRAWAL_TX_GAS_LIMIT}
    fee_token: "${ZONES_BENCH_TOKEN}"
    call:
      to: "${ZONES_BENCH_OUTBOX}"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "${ZONES_BENCH_TOKEN}"
        - { var: recipient }
        - ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
        - { var: memo }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

sequences:
  withdrawal:
    bindings:
      account:
        account:
          pool: users
          select: random
      recipient:
        address: ${ZONES_BENCH_RECIPIENT_GENERATOR}
      memo:
        bytes32:
          random_bytes: 32
    steps:
      - name: request
        template: request_withdrawal

mix:
  - sequence: withdrawal
    weight: 100
