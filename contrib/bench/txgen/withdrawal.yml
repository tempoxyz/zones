chain_id: __ZONE_CHAIN_ID__

gas:
  max_fee_per_gas: __ZONE_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __ZONE_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__ACCOUNT_START__, __ACCOUNT_END__]

artifacts:
  TIP20: abis/tip20.json
  ZoneOutbox: abis/zone-outbox.json

setup: { steps: [] }

templates:
  request_withdrawal:
    type: tempo
    from: { var: account.ref }
    gas_limit: __WITHDRAWAL_TX_GAS_LIMIT__
    fee_token: "__TOKEN__"
    call:
      to: "__OUTBOX__"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "__TOKEN__"
        - { var: account.address }
        - __WITHDRAWAL_AMOUNT__
        - { var: memo }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

sequences:
  withdrawal:
    bindings:
      account:
        account:
          pool: users
          select: random
      memo:
        bytes32:
          random_bytes: 32
    steps:
      - name: request
        template: request_withdrawal

mix:
  - sequence: withdrawal
    weight: 100
