chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}

gas:
  max_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_ACCOUNT_START}, ${ZONES_BENCH_ACCOUNT_END}]

artifacts:
  TIP20: abis/tip20.json

templates:
  tip20_transfer:
    type: tempo
    from: { var: sender.ref }
    gas_limit: ${ZONES_BENCH_ACTIVITY_GAS_LIMIT}
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_TOKEN}"
      abi: TIP20
      function: "transfer(address,uint256)"
      args:
        - { var: recipient }
        - ${ZONES_BENCH_ACTIVITY_AMOUNT}

sequences:
  activity:
    bindings:
      sender:
        account:
          pool: users
          select: random
      recipient:
        address: ${ZONES_BENCH_RECIPIENT_GENERATOR}
    steps:
      - name: transfer
        template: tip20_transfer

mix:
  - sequence: activity
    weight: 100
