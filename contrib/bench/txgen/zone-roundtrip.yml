chain_id: __ZONE_CHAIN_ID__

gas:
  max_fee_per_gas: __ZONE_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __ZONE_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__ACCOUNT_START__, __ACCOUNT_END__]
  recipients:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__RECIPIENT_ACCOUNT_START__, __RECIPIENT_ACCOUNT_END__]
  sponsor:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__SEQUENCER_ACCOUNT_INDEX__, __SEQUENCER_ACCOUNT_END__]

artifacts:
  TIP20: abis/tip20.json
  ZoneInbox: abis/zone-inbox.json
  ZoneOutbox: abis/zone-outbox.json

# Preflight injects one outbox approval per user here. Those setup transactions
# use the sequencer-backed sponsor pool and finish before scenario timing starts.
setup: { steps: [] }

templates:
  tip20_transfer:
    type: tempo
    from: { var: sender.ref }
    gas_limit: __ACTIVITY_GAS_LIMIT__
    fee_token: "__TOKEN__"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "__TOKEN__"
      abi: TIP20
      function: "transfer(address,uint256)"
      args:
        - { var: recipient }
        - __ACTIVITY_AMOUNT__

  request_withdrawal:
    type: tempo
    from: { var: account.ref }
    gas_limit: __WITHDRAWAL_TX_GAS_LIMIT__
    fee_token: "__TOKEN__"
    call:
      to: "__OUTBOX__"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "__TOKEN__"
        - { var: recipient }
        - __WITHDRAWAL_AMOUNT__
        - { random_bytes: 32 }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

sequences:
  activity:
    bindings:
      sender:
        account:
          pool: users
          select: random
      recipient:
        address: __RECIPIENT_GENERATOR__
    steps:
      - name: transfer
        template: tip20_transfer

  withdrawal:
    bindings:
      account:
        account:
          pool: users
          select: random
      recipient:
        address: __RECIPIENT_GENERATOR__
    steps:
      - name: request
        template: request_withdrawal

mix:
  - sequence: activity
    weight: 50
  - sequence: withdrawal
    weight: 50
