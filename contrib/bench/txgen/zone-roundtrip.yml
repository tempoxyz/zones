chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}

gas:
  max_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_ACCOUNT_START}, ${ZONES_BENCH_ACCOUNT_END}]
  recipients:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_RECIPIENT_ACCOUNT_START}, ${ZONES_BENCH_RECIPIENT_ACCOUNT_END}]
  sponsor:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_SEQUENCER_ACCOUNT_INDEX}, ${ZONES_BENCH_SEQUENCER_ACCOUNT_END}]

artifacts:
  TIP20: abis/tip20.json
  ZoneInbox: abis/zone-inbox.json
  ZoneOutbox: abis/zone-outbox.json

templates:
  outbox_approval:
    type: tempo
    from: { var: account.ref }
    sponsor: { pool: sponsor, select: { index: 0 } }
    gas_limit: ${ZONES_BENCH_APPROVAL_GAS_LIMIT}
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_TOKEN}"
      abi: TIP20
      function: "approve(address,uint256)"
      args:
        - "${ZONES_BENCH_OUTBOX}"
        - "115792089237316195423570985008687907853269984665640564039457584007913129639935"

  tip20_transfer:
    type: tempo
    from: { var: sender.ref }
    gas_limit: ${ZONES_BENCH_ACTIVITY_GAS_LIMIT}
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_TOKEN}"
      abi: TIP20
      function: "transfer(address,uint256)"
      args:
        - { var: recipient }
        - ${ZONES_BENCH_ACTIVITY_AMOUNT}

  request_withdrawal:
    type: tempo
    from: { var: account.ref }
    gas_limit: ${ZONES_BENCH_WITHDRAWAL_TX_GAS_LIMIT}
    fee_token: "${ZONES_BENCH_TOKEN}"
    call:
      to: "${ZONES_BENCH_OUTBOX}"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "${ZONES_BENCH_TOKEN}"
        - { var: recipient }
        - ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
        - { random_bytes: 32 }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

sequences:
  activity:
    bindings:
      sender:
        account:
          pool: users
          select: random
      recipient:
        address: ${ZONES_BENCH_RECIPIENT_GENERATOR}
    steps:
      - name: transfer
        template: tip20_transfer

  withdrawal:
    bindings:
      account:
        account:
          pool: users
          select: random
      recipient:
        address: ${ZONES_BENCH_RECIPIENT_GENERATOR}
    steps:
      - name: request
        template: request_withdrawal

mix:
  - sequence: activity
    weight: 50
  - sequence: withdrawal
    weight: 50
