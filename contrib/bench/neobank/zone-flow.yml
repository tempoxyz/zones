chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}

gas:
  max_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${ZONES_BENCH_ZONE_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_ACCOUNT_START}, ${ZONES_BENCH_ACCOUNT_END}]
  sponsor:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [${ZONES_BENCH_SEQUENCER_ACCOUNT_INDEX}, ${ZONES_BENCH_SEQUENCER_ACCOUNT_END}]

artifacts:
  TIP20: abis/tip20.json
  ZoneOutbox: abis/zone-outbox.json
  ZoneInbox: abis/neobank-zone-inbox.json
  EarnRouter: abis/earn-router.json

setup: { steps: [] }

templates:
  approve_base_token:
    type: tempo
    from: { var: account.ref }
    sponsor: { pool: sponsor, select: { index: 0 } }
    expiring_nonce: true
    valid_for_secs: 25
    gas_limit: 500000
    fee_token: "${ZONES_BENCH_TOKEN}"
    call:
      to: "${ZONES_BENCH_TOKEN}"
      abi: TIP20
      function: "approve(address,uint256)"
      args:
        - "${ZONES_BENCH_OUTBOX}"
        - "115792089237316195423570985008687907853269984665640564039457584007913129639935"

  approve_earn_token:
    type: tempo
    from: { var: account.ref }
    sponsor: { pool: sponsor, select: { index: 0 } }
    expiring_nonce: true
    valid_for_secs: 25
    gas_limit: 500000
    fee_token: "${ZONES_BENCH_TOKEN}"
    call:
      to: "${ZONES_BENCH_EARN_TOKEN}"
      abi: TIP20
      function: "approve(address,uint256)"
      args:
        - "${ZONES_BENCH_OUTBOX}"
        - "115792089237316195423570985008687907853269984665640564039457584007913129639935"

  gateway_deposit:
    type: tempo
    from: { var: account.ref }
    # NOT the same knob as the requestWithdrawal() *argument* below
    # (${ZONES_BENCH_CALLBACK_GAS_LIMIT}, the L1 callback's gas budget). This
    # is the Zone tx envelope's own gas limit for executing requestWithdrawal
    # itself, which only stores a pending withdrawal and emits an event -- no
    # callback runs here. The zone's genesis block gas limit is 30,000,000,
    # and reth's block builder reserves a tx's *declared* gas_limit against
    # that budget before executing it (so it can pack deterministically
    # without re-running a tx that turns out too big), not its actual gas
    # used. At 10,000,000 declared here, only 3 of these txs could ever fit
    # in one zone block regardless of how little gas requestWithdrawal
    # actually burns, forcing any 4th+ concurrent submission to queue into
    # later blocks -- observed adding multiple seconds of "Accepted"
    # (request_result) latency under the UI's normal benchmark concurrency
    # (up to 50). 1,000,000 keeps a >2x margin over approve_base_token's
    # measured-safe 500,000 for a comparably simple TIP-20
    # transferFrom+burn+storage-write+event call, while letting 30 of these
    # coexist per block instead of 3.
    gas_limit: 1000000
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_OUTBOX}"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "${ZONES_BENCH_TOKEN}"
        - "${ZONES_BENCH_EARN_ROUTER}"
        - ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
        - { var: action_id }
        - ${ZONES_BENCH_CALLBACK_GAS_LIMIT}
        - { var: account.address }
        - "0x"
        - "0x"

  gateway_redeem:
    type: tempo
    from: { var: account.ref }
    # See gateway_deposit's gas_limit comment above -- same
    # requestWithdrawal() call, same 3-per-block ceiling this avoids.
    gas_limit: 1000000
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_OUTBOX}"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "${ZONES_BENCH_EARN_TOKEN}"
        - "${ZONES_BENCH_EARN_ROUTER}"
        - ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
        - { var: action_id }
        - ${ZONES_BENCH_CALLBACK_GAS_LIMIT}
        - { var: account.address }
        - "0x"
        - "0x"

  offramp:
    type: tempo
    from: { var: account.ref }
    # See gateway_deposit's gas_limit comment above -- same
    # requestWithdrawal() call, same 3-per-block ceiling this avoids.
    gas_limit: 1000000
    fee_token: "${ZONES_BENCH_TOKEN}"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "${ZONES_BENCH_OUTBOX}"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "${ZONES_BENCH_TOKEN}"
        - "${ZONES_BENCH_BRIDGE_WALLET}"
        - ${ZONES_BENCH_ACTIVITY_AMOUNT}
        - { var: action_id }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

sequences:
  approval_pair:
    bindings:
      account:
        account: { pool: users, select: random }
    steps:
      - name: approve_base_token
        template: approve_base_token
      - name: approve_earn_token
        template: approve_earn_token

mix:
  - sequence: approval_pair
    weight: 100
