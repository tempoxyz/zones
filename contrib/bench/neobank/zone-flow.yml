chain_id: __ZONE_CHAIN_ID__

gas:
  max_fee_per_gas: __ZONE_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __ZONE_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__ACCOUNT_START__, __ACCOUNT_END__]
  sponsor:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__SEQUENCER_ACCOUNT_INDEX__, __SEQUENCER_ACCOUNT_END__]

artifacts:
  TIP20: ../txgen/abis/tip20.json
  ZoneOutbox: ../txgen/abis/zone-outbox.json
  ZoneInbox: abis/zone-inbox.json
  ZoneGateway: abis/zone-gateway.json

setup: { steps: [] }

templates:
  private_transfer:
    type: tempo
    from: { var: account.ref }
    gas_limit: __ACTIVITY_GAS_LIMIT__
    fee_token: "__DLUSD__"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "__DLUSD__"
      abi: TIP20
      function: "transfer(address,uint256)"
      args: [{ var: recipient.address }, __PRIVATE_TRANSFER_AMOUNT__]

  gateway_deposit:
    type: tempo
    from: { var: account.ref }
    gas_limit: __WITHDRAWAL_TX_GAS_LIMIT__
    fee_token: "__DLUSD__"
    call:
      to: "__OUTBOX__"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "__DLUSD__"
        - "__GATEWAY__"
        - __EARN_DEPOSIT_AMOUNT__
        - { var: action_id }
        - __CALLBACK_GAS_LIMIT__
        - { var: account.address }
        - "0x"
        - "0x"

  gateway_redeem:
    type: tempo
    from: { var: account.ref }
    gas_limit: __WITHDRAWAL_TX_GAS_LIMIT__
    fee_token: "__EARN_TOKEN__"
    call:
      to: "__OUTBOX__"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "__EARN_TOKEN__"
        - "__GATEWAY__"
        - __EARN_REDEEM_AMOUNT__
        - { var: action_id }
        - __CALLBACK_GAS_LIMIT__
        - { var: account.address }
        - "0x"
        - "0x"

  offramp:
    type: tempo
    from: { var: account.ref }
    gas_limit: __WITHDRAWAL_TX_GAS_LIMIT__
    fee_token: "__DLUSD__"
    call:
      to: "__OUTBOX__"
      abi: ZoneOutbox
      function: "requestWithdrawal(address,address,uint128,bytes32,uint64,address,bytes,bytes)"
      args:
        - "__DLUSD__"
        - "__BRIDGE_WALLET__"
        - __OFFRAMP_AMOUNT__
        - { var: action_id }
        - 0
        - { var: account.address }
        - "0x"
        - "0x"

mix: []
