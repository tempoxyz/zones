chain_id: __L1_CHAIN_ID__

gas:
  max_fee_per_gas: __L1_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __L1_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__ACCOUNT_START__, __ACCOUNT_END__]
  control:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__CONTROL_ACCOUNT_INDEX__, __CONTROL_ACCOUNT_END__]

artifacts:
  TIP20: txgen/abis/tip20.json
  ZonePortal: abis/neobank-zone-portal.json
  EarnRouter: abis/earn-router.json
  EarnContributionController: abis/earn-contribution-controller.json
  EarnVault: abis/earn-vault.json

setup: { steps: [] }

templates:
  encrypted_onramp:
    type: tempo
    from: { var: account.ref }
    gas_limit: __DEPOSIT_GAS_LIMIT__
    fee_token: "__ZONE_TOKEN__"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "__PORTAL__"
      abi: ZonePortal
      function: "depositEncrypted(address,uint128,uint256,(bytes32,uint8,bytes,bytes12,bytes16),address)"
      args:
        - "__ZONE_TOKEN__"
        - __ONRAMP_AMOUNT__
        - { var: encrypted.keyIndex }
        - { var: encrypted.encrypted }
        - { var: account.address }

  reward_approval:
    type: tempo
    from: { var: account.ref }
    gas_limit: __DEPOSIT_GAS_LIMIT__
    fee_token: "__PATHUSD__"
    call:
      to: "__PATHUSD__"
      abi: TIP20
      function: "approve(address,uint256)"
      args:
        - "__REWARDS__"
        - "__REWARD_FUND_AMOUNT__"

  reward_fund:
    type: tempo
    from: { var: account.ref }
    gas_limit: __REWARD_FUND_GAS_LIMIT__
    fee_token: "__PATHUSD__"
    call:
      to: "__REWARDS__"
      abi: EarnContributionController
      function: "fund(address,uint256,uint256)"
      args:
        - { var: account.address }
        - "__REWARD_FUND_AMOUNT__"
        - "__REWARD_MAX_EARN_SHARE_SUPPLY__"

mix: []
