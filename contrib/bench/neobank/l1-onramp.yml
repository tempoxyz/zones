chain_id: __L1_CHAIN_ID__

gas:
  max_fee_per_gas: __L1_MAX_FEE_PER_GAS__
  max_priority_fee_per_gas: __L1_MAX_PRIORITY_FEE_PER_GAS__

accounts:
  users:
    mnemonic: "${ZONES_BENCH_MNEMONIC}"
    range: [__ACCOUNT_START__, __ACCOUNT_END__]

artifacts:
  TIP20: txgen/abis/tip20.json
  ZonePortal: abis/zone-portal.json
  ZoneGateway: abis/zone-gateway.json

setup: { steps: [] }

templates:
  encrypted_onramp:
    type: tempo
    from: { var: account.ref }
    gas_limit: __DEPOSIT_GAS_LIMIT__
    fee_token: "__DLUSD__"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "__PORTAL__"
      abi: ZonePortal
      function: "depositEncrypted(address,uint128,uint256,(bytes32,uint8,bytes,bytes12,bytes16),address)"
      args:
        - "__DLUSD__"
        - __ONRAMP_AMOUNT__
        - { var: encrypted.keyIndex }
        - { var: encrypted.encrypted }
        - { var: account.address }

mix: []
