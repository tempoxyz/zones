version: 1

include:
  - ./scenario-fragments.yml

chains:
  l1:
    network: tempo
    rpc_url: "${L1_RPC_URL}"
    query_rpc_url: "${ZONES_BENCH_L1_QUERY_RPC_URL}"
    chain_id: __L1_CHAIN_ID__
    workload: ./l1-onramp.yml

  zone:
    network: tempo
    rpc_url: "${ZONE_PRIVATE_RPC_URL}"
    query_rpc_url: "${ZONE_RPC_URL}"
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${ZONES_BENCH_ZONE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: __ZONE_CHAIN_ID__
    workload: ./zone-flow.yml

scenario:
  name: neobank-third-party-recipient
  timeout: 10m

  bindings:
    account_a:
      account: { pool: users, select: lease }
    account_b:
      account: { pool: users, select: lease }
    account_a_entry_action_id:
      bytes32: { random_bytes: 32 }
    account_b_fee_action_id:
      bytes32: { random_bytes: 32 }
    earn_deposit_action_id:
      bytes32: { random_bytes: 32 }
    earn_redeem_action_id:
      bytes32: { random_bytes: 32 }

  steps:
    - use: encrypted-zone-entry
      as: account_a_entry
      with:
        sender: { var: account_a.ref }
        sender_address: { var: account_a.address }
        recipient: { var: account_a.address }
        token: "__PATHUSD__"
        fee_token: "__PATHUSD__"
        amount: __ONRAMP_AMOUNT__
        memo: { var: account_a_entry_action_id }

    - use: encrypted-zone-entry
      as: account_b_fee_entry
      with:
        sender: { var: account_b.ref }
        sender_address: { var: account_b.address }
        recipient: { var: account_b.address }
        token: "__PATHUSD__"
        fee_token: "__PATHUSD__"
        amount: __ONRAMP_AMOUNT__
        memo: { var: account_b_fee_action_id }

    - use: earn-deposit-and-return
      as: earn_deposit
      with:
        sender: { var: account_a.ref }
        sender_address: { var: account_a.address }
        recipient: { var: account_b.address }
        input_token: "__PATHUSD__"
        fee_token: "__PATHUSD__"
        amount: __EARN_DEPOSIT_AMOUNT__
        min_vault_assets: __EARN_DEPOSIT_AMOUNT__
        min_vault_shares: __EARN_DEPOSIT_AMOUNT__
        action_id: { var: earn_deposit_action_id }
        fallback_recipient: { var: account_a.address }
        refund_recipient: { var: account_a.address }

    - use: earn-redeem-and-return
      as: earn_redeem
      with:
        sender: { var: account_b.ref }
        sender_address: { var: account_b.address }
        recipient: { var: account_a.address }
        output_token: "__PATHUSD__"
        fee_token: "__PATHUSD__"
        amount: { var: earn_deposit.callback.args.earnShares }
        min_vault_assets: __EARN_REDEEM_AMOUNT__
        min_output_amount: __EARN_REDEEM_AMOUNT__
        action_id: { var: earn_redeem_action_id }
        fallback_recipient: { var: account_b.address }
        refund_recipient: { var: account_b.address }
