version: 1

include:
  - ./neobank-scenario-fragments.yml

chains:
  l1:
    network: tempo
    rpc_url: "${L1_RPC_URL}"
    query_rpc_url: "${ZONES_BENCH_L1_QUERY_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${L1_WS_RPC_URL}"
      poll_interval: 50ms
    chain_id: __L1_CHAIN_ID__
    workload: ./l1-onramp.yml

  zone:
    network: tempo
    rpc_url: "${ZONE_PRIVATE_RPC_URL}"
    query_rpc_url: "${ZONE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${ZONE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${ZONES_BENCH_ZONE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: __ZONE_CHAIN_ID__
    workload: ./zone-flow.yml

scenario:
  name: neobank-private-zone-flow
  execution: dag
  timeout: 10m

  bindings:
    account:
      account: { pool: users, select: lease }
    recipient:
      account: { pool: users, select: random }
    onramp_action_id:
      bytes32: { random_bytes: 32 }
    earn_deposit_action_id:
      bytes32: { random_bytes: 32 }
    earn_redeem_action_id:
      bytes32: { random_bytes: 32 }
    offramp_action_id:
      bytes32: { random_bytes: 32 }

  steps:
    - use: encrypted-zone-entry
      as: onramp
      with:
        sender: { var: account.ref }
        sender_address: { var: account.address }
        recipient: { var: account.address }
        token: "__DLUSD__"
        fee_token: "__DLUSD__"
        amount: __ONRAMP_AMOUNT__
        memo: { var: onramp_action_id }

    - id: private_transfer
      depends_on: [onramp.zone_deposit.processed]
      submit:
        chain: zone
        template: private_transfer
        with:
          from: { var: account.ref }
          fee_token: "__DLUSD__"
          call:
            args: [__PRIVATE_TRANSFER_RECIPIENT__, __PRIVATE_TRANSFER_AMOUNT__]
      save: private_transfer

    - id: private_transfer_receipt
      depends_on: [private_transfer]
      wait_receipt:
        chain: zone
        transaction_hash: { var: private_transfer.tx_hash }
        sender: { var: private_transfer.sender }
      timeout: 45s
      save: private_transfer_receipt

    - use: earn-deposit-and-return
      as: earn_deposit
      depends_on: [onramp.zone_deposit.processed]
      with:
        sender: { var: account.ref }
        sender_address: { var: account.address }
        recipient: { var: account.address }
        input_token: "__DLUSD__"
        fee_token: "__DLUSD__"
        amount: __EARN_DEPOSIT_AMOUNT__
        min_vault_assets: __EARN_DEPOSIT_AMOUNT__
        min_vault_shares: __EARN_DEPOSIT_AMOUNT__
        action_id: { var: earn_deposit_action_id }
        fallback_recipient: { var: account.address }
        refund_recipient: { var: account.address }

    - use: earn-redeem-and-return
      as: earn_redeem
      depends_on: [earn_deposit.zone_return.processed]
      with:
        sender: { var: account.ref }
        sender_address: { var: account.address }
        recipient: { var: account.address }
        output_token: "__DLUSD__"
        fee_token: "__DLUSD__"
        amount: { var: earn_deposit.zone_return.processed.args.amount }
        min_vault_assets: __EARN_REDEEM_AMOUNT__
        min_output_amount: __EARN_REDEEM_AMOUNT__
        action_id: { var: earn_redeem_action_id }
        fallback_recipient: { var: account.address }
        refund_recipient: { var: account.address }

    - id: l1_before_offramp
      depends_on: [earn_redeem.zone_return.processed]
      checkpoint: { chain: l1 }
      save: l1_before_offramp

    - id: offramp
      depends_on: [l1_before_offramp, earn_redeem.zone_return.processed]
      submit:
        chain: zone
        template: offramp
        with:
          from: { var: account.ref }
          fee_token: "__DLUSD__"
          call:
            args:
              - "__DLUSD__"
              - "__BRIDGE_WALLET__"
              - { var: earn_redeem.zone_return.processed.args.amount }
              - { var: offramp_action_id }
              - 0
              - { var: account.address }
              - "0x"
              - "0x"
      save: offramp

    - id: offramp_result
      depends_on: [earn_redeem.zone_return.processed, offramp]
      wait_log:
        chain: zone
        from_block: { var: earn_redeem.zone_return.processed.block_number }
        transaction_hash: { var: offramp.tx_hash }
        sender: { var: offramp.sender }
        address: "__OUTBOX__"
        abi: ZoneOutbox
        event: WithdrawalRequested
        where:
          sender: { var: account.address }
          token: "__DLUSD__"
          to: "__BRIDGE_WALLET__"
          amount: { var: earn_redeem.zone_return.processed.args.amount }
          fee: 0
          memo: { var: offramp_action_id }
          gasLimit: 0
          data: "0x"
          revealTo: "0x"
        max_block_range: 1000
      timeout: 45s
      save: offramp_result

    - id: offramp_processed
      depends_on: [l1_before_offramp, offramp]
      wait_log:
        chain: l1
        from_block: { var: l1_before_offramp.block_number }
        address: "__PORTAL__"
        abi: ZonePortal
        event: WithdrawalProcessed
        where:
          to: "__BRIDGE_WALLET__"
          senderTag:
            keccak256_packed:
              types: [address, bytes32]
              values: [{ var: account.address }, { var: offramp.tx_hash }]
          token: "__DLUSD__"
          amount: { var: earn_redeem.zone_return.processed.args.amount }
          callbackSuccess: true
        max_block_range: 1000
      save: offramp_processed

    - id: journey_complete
      depends_on:
        - private_transfer_receipt
        - offramp_result
        - offramp_processed
      checkpoint: { chain: l1 }
